<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>English Trainer</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English">
<meta name="application-name" content="English">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#FFFFFF; --surface:#FAFAFA; --card:#FFFFFF; --elev:#F4F4F5;
  --border:#E4E4E7; --border-strong:#D4D4D8;
  --fg:#09090B; --muted:#71717A; --faint:#A1A1AA;
  --primary:#18181B; --primary-fg:#FAFAFA;
  --ok:#16A34A; --ok-bg:#F0FDF4; --ok-br:#BBF7D0;
  --no:#DC2626; --no-bg:#FEF2F2; --no-br:#FECACA;
  --accent:#4F46E5; --accent-soft:#EEF2FF;
  --r:14px; --r-sm:10px; --r-xs:8px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 2px rgba(9,9,11,.04);
}
[data-theme="dark"]{
  --bg:#09090B; --surface:#0F0F11; --card:#18181B; --elev:#1F1F23;
  --border:#27272A; --border-strong:#3F3F46;
  --fg:#FAFAFA; --muted:#A1A1AA; --faint:#71717A;
  --primary:#FAFAFA; --primary-fg:#18181B;
  --ok:#4ADE80; --ok-bg:#0E2A18; --ok-br:#1B5E32;
  --no:#F87171; --no-bg:#2C1315; --no-br:#7F2A2A;
  --accent:#818CF8; --accent-soft:#1E1B34;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
#app{max-width:680px;margin:0 auto;padding:4px 16px 40px}

/* header */
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
}
.hd{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.hd h1{font-size:17px;font-weight:600;margin:0;flex:1;letter-spacing:-.02em}
.hd .sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.iconbtn{
  width:36px;height:36px;flex:0 0 36px;border:1px solid var(--border);background:var(--card);
  border-radius:var(--r-sm);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.iconbtn:active{background:var(--elev)}
.iconbtn svg{width:17px;height:17px;flex:0 0 17px;display:block}

/* typography */
h2{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:16px 0 6px}
h3{font-size:17px;font-weight:600;letter-spacing:-.015em;margin:28px 0 10px}
p{margin:0 0 10px}
.small{font-size:13.5px;color:var(--muted);line-height:1.5}
.label{font-size:12px;font-weight:500;color:var(--faint);margin:28px 0 10px;letter-spacing:0}
b,strong{font-weight:600}

/* cards & rows */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin:16px 0;box-shadow:var(--shadow)}
.row{
  display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer;
}
.row:active{background:var(--elev)}
.row .body{flex:1;min-width:0}
.row .t{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.row .s{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.row .chev{color:var(--faint);flex:0 0 16px;display:flex}
.row .chev svg{width:16px;height:16px;flex:0 0 16px;display:block}
.mark{
  width:26px;min-width:26px;max-width:26px;height:26px;min-height:26px;max-height:26px;
  flex:0 0 26px;align-self:center;box-sizing:border-box;
  border-radius:50%;border:1px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;color:var(--muted);font-weight:500;
}
.mark{font-size:13px}
.mark.done{font-size:14px;font-weight:700}
.mark.done{background:var(--ok);border-color:var(--ok);color:#fff}
.mark.cur{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.tags{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap}
.tags span{font-size:11px;color:var(--muted);background:var(--elev);border-radius:6px;padding:2px 7px}
.bar{height:4px;background:var(--elev);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* buttons */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-size:15px;font-weight:600;letter-spacing:-.01em;font-family:inherit;
  min-height:50px;padding:0 18px;border-radius:var(--r-sm);cursor:pointer;
  background:var(--primary);color:var(--primary-fg);border:1px solid var(--primary);
}
.btn svg{width:17px;height:17px;flex:0 0 17px;display:block}
.btn.sec{background:var(--card);color:var(--fg);border-color:var(--border)}
.btn.ghost{background:transparent;color:var(--muted);border-color:transparent}
.btn:active{opacity:.85}
.btn[disabled]{opacity:.4}
.seg{display:flex;background:var(--elev);border-radius:var(--r-sm);padding:3px;margin:26px 0 14px}
.seg button{
  flex:1;border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:500;
  color:var(--muted);padding:8px;border-radius:7px;cursor:pointer;
}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.back{
  display:flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);
  background:none;border:0;padding:14px 0 4px;cursor:pointer;font-family:inherit;
}
.back svg{width:15px;height:15px}

/* theory blocks */
.theory{padding-bottom:4px}
.theory p{font-size:15.5px;line-height:1.6;margin:0 0 12px}
.theory>*:first-child{margin-top:0}
.theory h3+table,.theory h3+.ex,.theory h3+.formula,.theory h3+.warn{margin-top:10px}
.theory p+table{margin-top:6px}
.theory ul{margin:0 0 12px;padding-left:20px}
.ex{
  position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:13px 44px 13px 15px;margin:14px 0;font-size:15.5px;line-height:1.45;
}
.ex .ru{display:block;font-size:13.5px;color:var(--muted);margin-top:5px;line-height:1.4}
.warn{
  background:var(--no-bg);border:1px solid var(--no-br);border-radius:var(--r-sm);
  padding:13px 15px;margin:16px 0;font-size:14.5px;line-height:1.55;
}
.formula{
  background:var(--accent-soft);border:1px solid transparent;border-radius:var(--r-sm);
  padding:13px 15px;margin:16px 0;font-size:15px;font-weight:500;line-height:1.5;
}
.goal{background:var(--accent-soft);border-radius:var(--r-sm);padding:14px 16px;margin:18px 0 6px;font-size:14.5px;line-height:1.5}
.gex{margin-top:11px;padding-top:11px;border-top:1px solid var(--border)}
.gex div{font-size:15px;font-weight:500;line-height:1.45;margin-bottom:6px}
.gex div:last-child{margin-bottom:0}
table{width:100%;border-collapse:collapse;margin:14px 0 22px;font-size:14.5px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--muted);padding:0 12px 9px 0;border-bottom:1px solid var(--border)}
td{padding:11px 12px 11px 0;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
td:last-child,th:last-child{padding-right:0}
td.ru{color:var(--muted);font-size:13.5px}
tr:last-child td{border-bottom:0}

/* speaker chip */
.spk{
  position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
}
.spk svg{width:14px;height:14px;flex:0 0 14px;display:block}
.spk:active{background:var(--elev)}
.w{cursor:pointer;border-bottom:1px dotted var(--border-strong)}
.w:active{background:var(--accent-soft)}

/* drill */
.qmeta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.qprog{height:3px;background:var(--elev);border-radius:99px;overflow:hidden;margin-bottom:20px}
.qprog i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s ease}
.qtask{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:-.01em;margin-bottom:12px}
.prompt{font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:4px 0 22px}
.playbox{margin-bottom:18px}
.bubble{background:var(--card);border:1px solid var(--border);border-radius:16px 16px 16px 4px;padding:14px 16px}
.steprow{
  display:flex;align-items:center;gap:11px;padding:11px 2px;
  border-top:1px solid var(--border);cursor:pointer;
}
.steprow:active{opacity:.6}
.stepmark{
  width:21px;height:21px;min-width:21px;flex:0 0 21px;border-radius:50%;
  border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;
  font-size:12px;line-height:1;color:var(--muted);box-sizing:border-box;
}
.stepmark.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:700}
.stept{font-size:14.5px;font-weight:500;letter-spacing:-.01em}
.steps2{font-size:12px;color:var(--muted);margin-top:1px}
.promptbox{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:14px 15px;margin:14px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:13px;line-height:1.55;color:var(--fg);white-space:pre-wrap;word-break:break-word;
  max-height:340px;overflow-y:auto;
}
.bubble .be{font-size:18px;font-weight:600;line-height:1.4;letter-spacing:-.01em}
.bubble .br{font-size:13.5px;color:var(--muted);margin-top:5px}
.tbar{height:6px;background:var(--elev);border-radius:99px;overflow:hidden;margin-bottom:18px}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:99px}
.target{font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.4}
.target .spk{vertical-align:middle;display:inline-flex}
.btn.mic.on{background:var(--no);border-color:var(--no);color:#fff}
.qtext{font-size:21px;line-height:1.4;font-weight:500;letter-spacing:-.02em;margin-bottom:6px}
.qtext .gap{display:inline-block;min-width:52px;border-bottom:2px solid var(--accent);margin:0 3px}
.qru{font-size:15px;color:var(--muted);font-weight:400;margin:8px 0 24px;letter-spacing:-.01em}
.opt{
  display:block;width:100%;text-align:left;font-family:inherit;font-size:16px;font-weight:500;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:15px 16px;margin-bottom:10px;cursor:pointer;color:var(--fg);
}
.opt:active{background:var(--elev)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.opt.no{border-color:var(--no);background:var(--no-bg);color:var(--no)}
input.ans{
  width:100%;font-family:inherit;font-size:17px;padding:15px 16px;color:var(--fg);
  border:1px solid var(--border);border-radius:var(--r-sm);background:var(--card);
}
input.ans:focus{outline:0;border-color:var(--accent)}
.verdict{border-radius:var(--r-sm);padding:15px;margin-top:20px;font-size:14.5px;line-height:1.6}
.verdict.ok{background:var(--ok-bg);border:1px solid var(--ok-br)}
.verdict.typo{background:var(--elev);border:1px solid var(--border)}
.verdict.typo .vh{color:var(--fg)}
.verdict.typo .right{color:var(--ok)}
.verdict.no{background:var(--no-bg);border:1px solid var(--no-br)}
.verdict .vh{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:6px}
.verdict.ok .vh{color:var(--ok)} .verdict.no .vh{color:var(--no)}
.verdict .vh svg{width:15px;height:15px;flex:0 0 15px;display:block}
.verdict .right{font-size:17px;font-weight:600;margin:2px 0 10px;letter-spacing:-.01em}
.done{text-align:center;padding:40px 0 24px}
.done .big{font-size:44px;font-weight:600;letter-spacing:-.03em}

/* bank / stats */
.chunk{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:12px 14px;margin-bottom:8px;
}
.chunk .cbody{flex:1}
.chunk .e{font-size:15.5px;font-weight:500}
.chunk .r{font-size:13px;color:var(--muted);margin-top:2px}
.statcard{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin:18px 0 14px}
.statcard>div{flex:1;padding:16px 10px;text-align:center;min-width:0}
.statcard>div+div{border-left:1px solid var(--border)}
.statcard .n{font-size:25px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.statcard .l{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.3}

/* nav */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:var(--bg);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);display:flex;
}
nav button{
  flex:1;background:none;border:0;padding:9px 4px 10px;cursor:pointer;font-family:inherit;
  font-size:11px;font-weight:500;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
}
nav button svg{width:21px;height:21px;flex:0 0 21px;display:block}
nav button.on{color:var(--fg)}
nav .dot{
  position:absolute;top:5px;left:50%;margin-left:6px;min-width:17px;height:17px;line-height:17px;
  background:var(--no);color:#fff;border-radius:99px;font-size:10px;font-weight:600;padding:0 4px;text-align:center;
}

/* word sheet */
#scrim{position:fixed;inset:0;background:rgba(9,9,11,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);
  border-radius:18px 18px 0 0;border-top:1px solid var(--border);
  padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .22s cubic-bezier(.32,.72,0,1);
  max-width:680px;margin:0 auto;max-height:82vh;overflow-y:auto;
}
#sheet.on{transform:none}
#sheet .grab{width:36px;height:4px;background:var(--border-strong);border-radius:99px;margin:0 auto 16px}
#sheet .word{font-size:26px;font-weight:600;letter-spacing:-.02em}
#sheet .ipa{font-size:15px;color:var(--muted);margin-top:4px}
#sheet .rus{font-size:15px;color:var(--muted)}
#sheet .tr{font-size:17px;margin-top:12px}
#sheet .miss{font-size:14px;color:var(--muted);margin-top:10px}
#sheet .sx{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
#sheet .sxi{margin-bottom:12px}
#sheet .sxi:last-child{margin-bottom:0}
#sheet .sxe{font-size:15.5px;font-weight:500;line-height:1.45}
#sheet .sxe .spk{vertical-align:middle;display:inline-flex}
#sheet .sxr{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="hd"><h1 id="hTitle">English Trainer</h1><span class="sub" id="hSub"></span>
<button class="iconbtn" id="themeBtn" aria-label="Тема"></button></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="scrim"></div>
<div id="sheet"></div>
<script>

const LESSONS = [

/* ============ 0 ============ */
{id:"abc", t:"Слова, которыми я объясняю", s:"Пять понятий — дальше всё читается легко", theory:`
<p>Прежде чем начинать, договоримся о словах. Дальше в уроках я пользуюсь только этими пятью — если они понятны, понятно будет всё остальное.</p>

<h3>1. Подлежащее — кто действует</h3>
<p>Тот, о ком предложение. В английском оно обязательно, даже когда в русском его нет.</p>
<div class="ex">I work. · My brother works. · It works.<span class="ru">Я работаю. · Мой брат работает. · Оно работает.</span></div>
<p>По-русски можно сказать «Холодно» или «Надо идти» — без подлежащего. По-английски нельзя, обязательно кто-то должен стоять впереди: <span class="en">It's cold. · We need to go.</span></p>

<h3>2. Смысловой глагол — само действие</h3>
<p>Слово, которое несёт смысл: work, go, eat, think, buy. Оно отвечает на вопрос «что делает».</p>

<h3>3. Вспомогательный глагол — служебное слово-помощник</h3>
<p>Слово, у которого своего смысла нет, но без него не построить вопрос или отрицание. Помощников всего три группы:</p>
<table class="eng">
<tr><td>do, does, did</td><td class="ru">помогают всем обычным глаголам</td></tr>
<tr><td>am, is, are, was, were</td><td class="ru">формы глагола be (быть)</td></tr>
<tr><td>can, will, would, should…</td><td class="ru">модальные — сами себе помощники</td></tr>
</table>
<p>На русский помощник не переводится никак. В <span class="en">Do you work?</span> слово do не значит «делать» — оно просто показывает, что это вопрос.</p>

<h3>4. Он / она / оно = he / she / it</h3>
<p>Это единственное место, где английский глагол меняет форму. В настоящем времени к глаголу для he, she, it добавляется <b>-s</b>:</p>
<table class="eng">
<tr><td>I work · you work · we work · they work</td><td class="ru">без -s</td></tr>
<tr><td>he work<b>s</b> · she work<b>s</b> · it work<b>s</b></td><td class="ru">с -s</td></tr>
</table>
<p>Сюда же попадает любое имя и любой предмет в единственном числе: <span class="en">Anna works. My laptop works. The shop opens at 9.</span></p>

<h3>5. Три формы глагола</h3>
<p>У каждого глагола есть три формы. Их пишут в словаре подряд.</p>
<table class="eng">
<tr><th>1-я (словарная)</th><th>2-я (прошлое)</th><th>3-я</th></tr>
<tr><td>work</td><td>worked</td><td>worked</td></tr>
<tr><td>go</td><td>went</td><td>gone</td></tr>
<tr><td>see</td><td>saw</td><td>seen</td></tr>
</table>
<p>Первая — обычная, из словаря. Вторая — прошедшее время: <span class="en">I went there.</span> Третья сама по себе не употребляется, она нужна только вместе с have или be: <span class="en">I have seen it.</span></p>
<p>У большинства глаголов 2-я и 3-я формы одинаковые и делаются добавлением <b>-ed</b>: work → worked. Такие глаголы называют правильными. Остальные (go → went → gone) приходится запоминать, их около сорока штук — они в разделе «Банк».</p>

<h3>6. Сокращения, которые встретятся сразу</h3>
<p>В отрицаниях <b>not</b> почти всегда сливается с помощником. Полную форму пишут только когда хотят подчеркнуть.</p>
<table class="eng">
<tr><td>do not = <b>don't</b></td><td class="ru">I don't work — я не работаю</td></tr>
<tr><td>does not = <b>doesn't</b></td><td class="ru">He doesn't work — он не работает</td></tr>
<tr><td>did not = <b>didn't</b></td><td class="ru">I didn't work — я не работал</td></tr>
<tr><td>is not = <b>isn't</b> · are not = <b>aren't</b></td><td class="ru">She isn't here — её здесь нет</td></tr>
<tr><td>cannot = <b>can't</b> · will not = <b>won't</b></td><td class="ru">I can't come — я не могу прийти</td></tr>
</table>
<p class="small">Читается: don't — «доунт», doesn't — «дазнт», didn't — «диднт».</p>

/* ============ 1 ============ */
{id:"mech", t:"Как собрать вопрос и отрицание", s:"Три помощника — вся механика английского", theory:`
<p>Главное отличие от русского. В русском отрицание делается одним словом «не», которое ставится перед любым глаголом: <i>я не работаю, я не пошёл, я не могу</i>. В английском так нельзя. Обычному глаголу нужен помощник.</p>

<h3>Шаг 1. Утверждение</h3>
<table class="eng">
<tr><td>I work here.</td><td class="ru">Я здесь работаю.</td></tr>
<tr><td>He work<b>s</b> here.</td><td class="ru">Он здесь работает. (-s, потому что «он»)</td></tr>
<tr><td>I worked here.</td><td class="ru">Я здесь работал. (2-я форма — прошлое)</td></tr>
</table>

<h3>Шаг 2. Отрицание — появляется помощник do</h3>
<p>Чтобы сказать «не», перед глаголом ставится <b>do not</b>, для he/she/it — <b>does not</b>, для прошлого — <b>did not</b>. В речи они всегда сливаются в don't, doesn't, didn't.</p>
<table class="eng">
<tr><td>I <b>don't</b> work here.</td><td class="ru">Я здесь не работаю.</td></tr>
<tr><td>He <b>doesn't</b> work here.</td><td class="ru">Он здесь не работает.</td></tr>
<tr><td>They <b>don't</b> know.</td><td class="ru">Они не знают.</td></tr>
<tr><td>I <b>didn't</b> work yesterday.</td><td class="ru">Я вчера не работал.</td></tr>
</table>
<p>Обрати внимание на глагол после помощника — он везде голый: <b>work</b>, а не works и не worked.</p>

<h3>Почему глагол становится голым</h3>
<p>Признак может стоять только в одном месте — либо на помощнике, либо на глаголе. Помощник забирает его себе.</p>
<table class="eng">
<tr><td>He work<b>s</b></td><td class="ru">-s на глаголе, помощника нет</td></tr>
<tr><td>He <b>does</b>n't work</td><td class="ru">-s ушло в does, глагол пустой</td></tr>
<tr><td>I work<b>ed</b></td><td class="ru">прошлое на глаголе</td></tr>
<tr><td>I <b>did</b>n't work</td><td class="ru">прошлое ушло в did, глагол пустой</td></tr>
</table>
<div class="warn">Поэтому неверно: <s>He doesn't works</s> и <s>I didn't worked</s>. Признак уже стоит в помощнике, второй раз его ставить не надо.</div>

<h3>Шаг 3. Вопрос — помощник выходит вперёд</h3>
<table class="eng">
<tr><td><b>Do</b> you work here?</td><td class="ru">Ты здесь работаешь?</td></tr>
<tr><td><b>Does</b> he work here?</td><td class="ru">Он здесь работает?</td></tr>
<tr><td><b>Did</b> you work yesterday?</td><td class="ru">Ты вчера работал?</td></tr>
<tr><td>Where <b>do</b> you work?</td><td class="ru">Где ты работаешь?</td></tr>
</table>
<p>Схема одна и та же: помощник → кто → голый глагол → остальное.</p>

<h3>Шаг 4. Когда помощник do не нужен</h3>
<p>Если в предложении уже есть <b>be</b> (am, is, are, was, were) или модальный глагол (can, will, should…), они сами работают помощниками. Do к ним не добавляется.</p>
<table class="eng">
<tr><td>She <b>is</b> tired.</td><td>She <b>isn't</b> tired.</td><td><b>Is</b> she tired?</td></tr>
<tr><td>I <b>can</b> swim.</td><td>I <b>can't</b> swim.</td><td><b>Can</b> you swim?</td></tr>
<tr><td>They <b>are</b> working.</td><td>They <b>aren't</b> working.</td><td><b>Are</b> they working?</td></tr>
</table>
<div class="warn">Два помощника подряд не ставятся:<br><s>Do you can swim?</s> → <span class="en">Can you swim?</span><br><s>He doesn't is here</s> → <span class="en">He isn't here.</span></div>

<h3>Как понять, какой помощник брать</h3>
<div class="formula">Есть в предложении be или модал → он и есть помощник.<br>Нет → берём do / does / did.</div>

<h3>Порядок слов</h3>
<p>В русском слова можно переставлять как угодно: «я вчера купил ноутбук», «купил я вчера ноутбук». В английском порядок закреплён.</p>
<div class="formula">Кто → что делает → что или кого → как → где → когда</div>
<div class="ex">I bought a new laptop online yesterday.<span class="ru">Я вчера онлайн купил новый ноутбук.</span></div>
<div class="ex">She sent me the file this morning.<span class="ru">Она прислала мне файл сегодня утром.</span></div>
<p class="small">Единственное, что можно двигать свободно — время. Его разрешено вынести в начало: <span class="en">Yesterday I bought a new laptop.</span></p>

{t:"mc",q:"I ___ understand.",ru:"Я не понимаю.",o:["don't","am not","doesn't"],a:0,ex:"Understand — обычный глагол, значит помощник do, а для «я» это don't.\nAm not ставится, только если дальше идёт прилагательное или -ing: I'm not tired. I'm not working.\nDoesn't — это форма для he, she, it, для «я» она не подходит."},
{t:"in",task:"Собери предложение",q:"вчера / я / позвонил / ему",a:["i called him yesterday","yesterday i called him"],ex:"Порядок: кто → что сделал → кому → когда. I called him yesterday.\nВремя разрешено вынести в начало: Yesterday I called him. Всё остальное двигать нельзя — в английском место слова показывает его роль."},
{t:"mc",q:"___ you finish the report?",ru:"Ты закончил отчёт?",o:["Did","Do","Are"],a:0,ex:"Действие закончено в прошлом, значит помощник did, а глагол после него голый — finish, не finished.\nЕщё: Did you call him? Did she like it? Did they come?"},

/* ============ 2 ============ */
{id:"pres-simple", t:"Present Simple", s:"Привычки, факты, мнения — база всей речи", theory:`
<p>Самое частое время в разговоре. Им говорят обо всём, что происходит регулярно или является фактом: где живёшь, кем работаешь, что любишь, что думаешь.</p>

<h3>Формы</h3>
<table class="eng">
<tr><td class="ru">утверждение</td><td>I work in IT.<br>He work<b>s</b> in IT.</td></tr>
<tr><td class="ru">отрицание</td><td>I <b>don't</b> work on weekends.<br>He <b>doesn't</b> work here.</td></tr>
<tr><td class="ru">вопрос</td><td><b>Do</b> you work remotely?<br><b>Does</b> she know about it?</td></tr>
</table>
<div class="formula">-s появляется только у he, she, it и только в утверждении. В отрицании и вопросе его забирает помощник.</div>

<h3>Где это используется</h3>
<p><b>Постоянные факты о себе.</b></p>
<div class="ex">I live in Bali. I work in IT. I have a small studio. I speak Russian and a bit of English.<span class="ru">Живу на Бали. Работаю в IT. У меня небольшая студия. Говорю по-русски и немного по-английски.</span></div>

<p><b>Привычки и регулярные действия.</b> Часто рядом стоят слова-маркеры: usually, always, never, often, sometimes, every day, on Mondays, twice a week.</p>
<div class="ex">I usually work from home. · I never drink coffee after six. · We go to the beach every weekend.<span class="ru">Обычно работаю из дома. · Никогда не пью кофе после шести. · Мы ходим на пляж каждые выходные.</span></div>

<p><b>Мнения, чувства, отношение.</b> Всё, что ты думаешь и любишь, стоит именно в этом времени.</p>
<div class="ex">I think it's fine. · I like this place. · I don't care. · It depends. · I agree with you. · I need more time.<span class="ru">Думаю, нормально. · Мне нравится это место. · Мне всё равно. · Зависит от ситуации. · Согласен с тобой. · Мне нужно больше времени.</span></div>

<p><b>Расписания и правила.</b></p>
<div class="ex">The shop opens at nine. · The bus leaves in ten minutes.<span class="ru">Магазин открывается в девять. · Автобус отходит через десять минут.</span></div>

<h3>Куда девается -s</h3>
<table class="eng">
<tr><td>He likes it.</td><td class="ru">есть -s</td></tr>
<tr><td>He doesn't like it.</td><td class="ru">-s ушло в doesn't</td></tr>
<tr><td>Does he like it?</td><td class="ru">-s ушло в does</td></tr>
</table>
<p class="small">После шипящих и -o добавляется -es: watch → watches, go → goes, do → does. После согласной с -y меняется на -ies: study → studies.</p>

<div class="warn">Частые ошибки:<br>
<s>I am agree</s> → <span class="en">I agree</span> — agree это глагол, be рядом не нужен.<br>
<s>I very like it</s> → <span class="en">I really like it</span> или <span class="en">I like it a lot</span> — very перед глаголом не ставится.<br>
<s>It's depends</s> → <span class="en">It depends</span> — глагол уже есть, второй не нужен.</div>

{t:"in",task:"Переведи",ru:"Он не знает об этом.",a:["he doesn't know about it","he does not know about it","he doesn't know about this"],ex:"Doesn't + know без -s, потому что окончание уже внутри помощника.\nЕщё: She doesn't know. They don't know. I didn't know — я не знал."},
{t:"mc",q:"The shop ___ at nine.",ru:"Магазин открывается в девять.",o:["opens","open","is opening"],a:0,ex:"Расписания стоят в Present Simple: shop — это «оно», значит opens.\nТак же: The bus leaves at 7. The class starts on Monday."}

/* ============ 3 ============ */
{id:"pres-cont", t:"Present Continuous", s:"Сейчас, временно, договорённость", theory:`
<div class="formula">am / is / are + глагол с окончанием <b>-ing</b></div>
<p>Здесь помощник — форма глагола be. Он же строит отрицание и вопрос, do не нужен.</p>
<table class="eng">
<tr><td class="ru">утверждение</td><td>I'<b>m</b> working right now. · He'<b>s</b> sleeping. · They'<b>re</b> waiting.</td></tr>
<tr><td class="ru">отрицание</td><td>I'<b>m not</b> working today. · She <b>isn't</b> coming.</td></tr>
<tr><td class="ru">вопрос</td><td><b>Are</b> you working tomorrow? · <b>What are</b> you doing?</td></tr>
</table>
<p class="small">Формы be: I → am, he/she/it → is, you/we/they → are.</p>

<h3>Смысл 1: прямо сейчас, в эту минуту</h3>
<div class="ex">What are you doing? — I'm cooking. · Sorry, I can't talk, I'm driving.<span class="ru">Что делаешь? — Готовлю. · Извини, не могу говорить, я за рулём.</span></div>

<h3>Смысл 2: временно, в этот период жизни</h3>
<p>Не обязательно в эту секунду — важно, что это состояние временное, а не постоянное.</p>
<div class="ex">I'm learning English. · I'm staying in Canggu this month. · He's looking for a new job.<span class="ru">Сейчас я учу английский. · В этом месяце живу в Чангу. · Он сейчас ищет новую работу.</span></div>
<p>Сравни разницу с постоянным:</p>
<table class="eng">
<tr><td>I live in Bali.</td><td class="ru">живу постоянно</td></tr>
<tr><td>I'm living in Bali at the moment.</td><td class="ru">пока живу здесь, но это временно</td></tr>
<tr><td>She works at a cafe.</td><td class="ru">её работа</td></tr>
<tr><td>She's working at a cafe this summer.</td><td class="ru">подрабатывает этим летом</td></tr>
</table>

<h3>Смысл 3: договорённость в будущем</h3>
<p>Если время и люди уже определены — носители говорят об этом в continuous, а не через will.</p>
<div class="ex">I'm meeting him at seven. · We're flying on Friday. · What are you doing this weekend?<span class="ru">Встречаюсь с ним в семь. · Улетаем в пятницу. · Что делаешь в эти выходные?</span></div>

<h3>Глаголы, которые в -ing не ставятся</h3>
<p>Это глаголы состояния, а не действия. Состояние нельзя «делать прямо сейчас».</p>
<p class="small en">know · want · need · like · love · hate · understand · mean · believe · remember · seem · belong · cost</p>
<div class="warn"><s>I'm knowing</s> → <span class="en">I know</span><br><s>I'm wanting</s> → <span class="en">I want</span><br><s>I'm understanding</s> → <span class="en">I understand</span></div>
<p class="small">Исключение, которое слышно везде: <span class="en">I'm loving it</span> — но это рекламный слоган, а не правило.</p>
`,cards:[
{t:"mc",q:"Sorry, I can't talk — I ___ .",ru:"Извини, не могу говорить — я за рулём.",o:["'m driving","drive","drives"],a:0,ex:"Действие происходит прямо в момент разговора, значит am + driving.\nI drive означало бы «я умею водить» или «я вожу машину вообще, как правило» — совсем другой смысл."},

/* ============ 4 ============ */
{id:"past-simple", t:"Past Simple", s:"Главное время прошлого", theory:`
<p>Это время закрывает почти всё прошлое. Если действие закончилось — бери его и не думай.</p>
<table class="eng">
<tr><td class="ru">утверждение</td><td>I <b>went</b> there yesterday. · I <b>worked</b> all day. · She <b>called</b> me.</td></tr>
<tr><td class="ru">отрицание</td><td>I <b>didn't go</b>. · She <b>didn't call</b> me.</td></tr>
<tr><td class="ru">вопрос</td><td><b>Did</b> you <b>go</b>? · <b>What did</b> you <b>do</b>?</td></tr>
</table>

<h3>Как получить форму прошлого</h3>
<p>У правильных глаголов добавляется <b>-ed</b>: work → worked, call → called, open → opened, want → wanted.<br>
У неправильных форму надо знать: go → went, see → saw, buy → bought, take → took.</p>
<p class="small">Мелочи написания: love → loved (одна e), stop → stopped (согласная удваивается), study → studied (y меняется на i).</p>

<h3>В отрицании и вопросе прошлого нет</h3>
<p>Признак прошедшего времени переезжает в did, а сам глагол возвращается в словарную форму.</p>
<table class="eng">
<tr><td>I went</td><td>I <b>didn't go</b></td><td><b>Did</b> you <b>go</b>?</td></tr>
<tr><td>She bought it</td><td>She <b>didn't buy</b> it</td><td><b>Did</b> she <b>buy</b> it?</td></tr>
<tr><td>They saw us</td><td>They <b>didn't see</b> us</td><td><b>Did</b> they <b>see</b> us?</td></tr>
</table>
<div class="warn"><s>I didn't went</s> → <span class="en">I didn't go</span><br><s>Did you saw?</s> → <span class="en">Did you see?</span><br>Прошедшее время стоит только в одном месте — в did.</div>

<h3>Отдельно: глагол be</h3>
<p>У be своё прошедшее время, и помощник ему не нужен.</p>
<table class="eng">
<tr><td>I / he / she / it → <b>was</b></td><td>I was tired. · It wasn't expensive.</td></tr>
<tr><td>you / we / they → <b>were</b></td><td>They were late. · Were you there?</td></tr>
</table>

<h3>Маркеры</h3>
<p class="small en">yesterday · last week · last year · two days ago · in 2019 · when I was young · then · at that time</p>

<h3>Практическое правило</h3>
<div class="formula">Сомневаешься между Past Simple и чем-то более сложным — бери Past Simple. Тебя поймут всегда и везде.</div>
<p class="small">Полный список неправильных глаголов лежит в разделе «Банк». Учить их лучше не столбиком, а сразу во фразе: <span class="en">I forgot my password. · I lost my keys. · I brought it with me.</span></p>

{t:"in",task:"Сделай вопрос",q:"You bought it online.",a:["did you buy it online"],ex:"Помощник did выходит вперёд и забирает прошедшее время, поэтому bought превращается обратно в buy.\nТак же: You took it → Did you take it? You saw him → Did you see him?"},

{t:"in",task:"Поставь в прошедшее",q:"I take a taxi.",a:["i took a taxi"],ex:"Take — неправильный глагол: take — took — taken.\nВ утверждении ставим вторую форму: I took a taxi. В отрицании она не нужна: I didn't take a taxi."},

{t:"mc",q:"It ___ very expensive.",ru:"Это было очень дорого.",o:["wasn't","didn't was","didn't be"],a:0,ex:"У глагола be своё прошедшее: was и were. Помощник did ему не нужен, not вешается прямо на него.\nI was tired. · They weren't home. · Was it expensive?"}

/* ============ 5 ============ */
{id:"pres-perf", t:"Present Perfect", s:"Единственное сложное, которое стоит выучить", theory:`
<div class="formula">have (для he/she/it — has) + <b>третья форма</b> глагола</div>
<p>В русском такого времени нет, поэтому его пропускают. Смысл такой: событие было в прошлом, но <b>момент не важен и не назван</b>. Важно то, что есть сейчас — опыт или результат.</p>

<h3>Формы</h3>
<table class="eng">
<tr><td class="ru">утверждение</td><td>I'<b>ve</b> been to Thailand. · She'<b>s</b> finished the project.</td></tr>
<tr><td class="ru">отрицание</td><td>I <b>haven't</b> seen it. · He <b>hasn't</b> called.</td></tr>
<tr><td class="ru">вопрос</td><td><b>Have</b> you been there? · <b>Has</b> she finished?</td></tr>
</table>
<p class="small">Сокращения: I've, you've, we've, they've, he's, she's. Здесь 's — это has, потому что дальше идёт третья форма.</p>

<h3>Случай 1: опыт за жизнь</h3>
<p>Было ли такое вообще, хоть когда-нибудь. Часто рядом ever и never.</p>
<div class="ex">I've been to Japan twice. · Have you ever tried durian? · I've never been to the US.<span class="ru">Я был в Японии дважды. · Ты когда-нибудь пробовал дуриан? · Я никогда не был в США.</span></div>

<h3>Случай 2: результат виден сейчас</h3>
<p>Действие в прошлом, но последствие в настоящем.</p>
<div class="ex">I've lost my keys. · She's finished the project. · He's gone home.<span class="ru">Я потерял ключи — их до сих пор нет. · Она закончила проект — он готов. · Он ушёл домой — его здесь нет.</span></div>

<h3>Случай 3: just, already, yet</h3>
<div class="ex">I've just eaten. · I've already sent it. · Have you finished yet? — Not yet.<span class="ru">Я только что поел. · Я это уже отправил. · Ты уже закончил? — Ещё нет.</span></div>

<h3>Случай 4: период, который ещё идёт</h3>
<p>Началось в прошлом и продолжается прямо сейчас. Это то место, где русскоязычные ошибаются чаще всего.</p>
<div class="ex">I've lived here for two years. · I've worked at CDEV since 2015. · We've known each other for ages.<span class="ru">Я живу здесь два года. · Работаю в CDEV с 2015. · Мы знакомы сто лет.</span></div>
<div class="warn">По-русски здесь настоящее время: «я живу здесь два года». По-английски так сказать нельзя.<br><s>I live here two years</s> → <span class="en">I've lived here for two years.</span></div>
<p class="small"><b>for</b> ставится перед длительностью: for three years, for two hours, for a week.<br><b>since</b> ставится перед точкой старта: since Monday, since 2020, since I moved here.</p>

<h3>Как выбрать между Past Simple и Present Perfect</h3>
<div class="formula">Назван конкретный законченный момент → Past Simple.<br>Момент не назван или период ещё не кончился → Present Perfect.</div>
<table class="eng">
<tr><td>I saw him yesterday.</td><td class="ru">сказано когда — простое прошедшее</td></tr>
<tr><td>I've seen him.</td><td class="ru">когда — неважно, важен сам факт</td></tr>
<tr><td>I lived in Moscow for ten years.</td><td class="ru">жил и уехал, период закрыт</td></tr>
<tr><td>I've lived here for ten years.</td><td class="ru">живу до сих пор</td></tr>
</table>
<p class="small">Проверка простая: если в предложение можно вставить yesterday, last year, in 2019 — это Past Simple.</p>

/* ============ 6 ============ */
{id:"future", t:"Будущее: will и going to", s:"Три способа и как выбрать между ними", theory:`
<p>Будущее в английском выражается тремя способами, и они не взаимозаменяемы. Разница в том, откуда взялось это будущее действие.</p>

<h3>will — решение прямо сейчас, обещание, предсказание</h3>
<table class="eng">
<tr><td class="ru">+</td><td>I <b>will</b> call you. → чаще коротко: I'<b>ll</b> call you.</td></tr>
<tr><td class="ru">−</td><td>I <b>won't</b> be late. <span class="ru">(won't = will not)</span></td></tr>
<tr><td class="ru">?</td><td><b>Will</b> you be there?</td></tr>
</table>
<div class="ex">[телефон зазвонил] I'll get it! · Don't worry, I'll help you. · I think it'll be fine.<span class="ru">Я возьму! · Не переживай, я помогу. · Думаю, всё будет нормально.</span></div>
<p class="small">Ключевое: решение родилось в момент речи. Или это твоё предположение о будущем.</p>

<h3>be going to — план, который был раньше</h3>
<table class="eng">
<tr><td class="ru">+</td><td>I'<b>m going to</b> look for a new job.</td></tr>
<tr><td class="ru">−</td><td>I'<b>m not going to</b> argue about this.</td></tr>
<tr><td class="ru">?</td><td><b>Are</b> you <b>going to</b> tell him?</td></tr>
</table>
<div class="ex">I'm going to change my phone. · We're going to move next year.<span class="ru">Я собираюсь сменить телефон. · Мы собираемся переехать в следующем году.</span></div>
<p>Сюда же попадает будущее, которое видно по признакам прямо сейчас:</p>
<div class="ex">Look at those clouds — it's going to rain. · Careful, you're going to drop it.<span class="ru">Посмотри на тучи — сейчас будет дождь. · Осторожно, уронишь.</span></div>

<h3>Present Continuous — назначенная встреча</h3>
<p>Время и люди уже определены, это записано в календаре.</p>
<div class="ex">I'm meeting Anna at eight. · We're flying on Friday.<span class="ru">Встречаюсь с Анной в восемь. · Улетаем в пятницу.</span></div>

<h3>Сравнение на одном примере</h3>
<table class="eng">
<tr><td>I'll call him.</td><td class="ru">только что решил, позвоню</td></tr>
<tr><td>I'm going to call him.</td><td class="ru">собирался и раньше, есть намерение</td></tr>
<tr><td>I'm calling him at five.</td><td class="ru">договорились на пять</td></tr>
</table>
<div class="formula">Запутался — бери going to. Оно подходит почти везде и звучит естественно.</div>

<h3>Как это звучит в речи</h3>
<p class="small">Going to в разговоре сжимается до <span class="en">gonna</span>: I'm gonna check. Пишем полностью, произносим коротко. Will почти всегда сливается: I'll, we'll, it'll, they'll.</p>

<h3>Ключевая фраза: was going to</h3>
<p>Прошедшая форма от going to. Означает «собирался, но не вышло» — в разговоре встречается постоянно.</p>
<div class="ex">I was going to call you, but I forgot. · We were going to go out, but it started raining.<span class="ru">Я собирался позвонить, но забыл. · Мы собирались выйти, но пошёл дождь.</span></div>

{id:"questions", t:"Сборка вопроса", s:"То, на чём держится любой диалог", theory:`
<p>Разговор состоит из вопросов. Если вопрос собирается медленно, диалог рвётся. Хорошая новость: схема одна для всех времён.</p>
<div class="formula">(вопросительное слово) → помощник → кто → глагол → остальное</div>

<h3>Одна схема, разные помощники</h3>
<table class="eng">
<tr><td class="ru">обычный глагол, настоящее</td><td>What <b>do you</b> do? · Where <b>does she</b> live?</td></tr>
<tr><td class="ru">обычный глагол, прошлое</td><td>When <b>did you</b> arrive? · What <b>did he</b> say?</td></tr>
<tr><td class="ru">форма с -ing</td><td>What <b>are you</b> doing? · Why <b>is he</b> waiting?</td></tr>
<tr><td class="ru">be сам по себе</td><td>Where <b>are you</b> from? · <b>Was it</b> expensive?</td></tr>
<tr><td class="ru">present perfect</td><td><b>Have you</b> been there? · How long <b>have you</b> lived here?</td></tr>
<tr><td class="ru">модальный глагол</td><td><b>Can you</b> help? · <b>Should I</b> wait?</td></tr>
</table>

<h3>Вопросительные слова</h3>
<table class="eng">
<tr><td>what</td><td class="ru">что, какой — What do you think?</td></tr>
<tr><td>who</td><td class="ru">кто — Who told you?</td></tr>
<tr><td>where</td><td class="ru">где, куда — Where are you going?</td></tr>
<tr><td>when</td><td class="ru">когда — When did it happen?</td></tr>
<tr><td>why</td><td class="ru">почему — Why not?</td></tr>
<tr><td>how</td><td class="ru">как — How does it work?</td></tr>
<tr><td>which</td><td class="ru">который из — Which one do you want?</td></tr>
<tr><td>how much / how many</td><td class="ru">сколько (цена и неисчисляемое / количество штук)</td></tr>
<tr><td>how long</td><td class="ru">сколько времени — How long does it take?</td></tr>
<tr><td>how often</td><td class="ru">как часто — How often do you go there?</td></tr>
<tr><td>what kind of</td><td class="ru">какого рода — What kind of music do you like?</td></tr>
</table>

<h3>Исключение: вопрос к тому, кто действует</h3>
<p>Если спрашиваешь «кто сделал» или «что случилось», то вопросительное слово само является подлежащим. Помощник в этом случае не нужен, порядок как в обычном предложении.</p>
<table class="eng">
<tr><td><b>Who called</b> you?</td><td class="ru">Кто тебе звонил?</td></tr>
<tr><td><b>What happened?</b></td><td class="ru">Что случилось?</td></tr>
<tr><td>Who <b>did</b> you call?</td><td class="ru">Кому ты звонил? — здесь спрашиваем не о том, кто действует, поэтому did вернулся</td></tr>
</table>

<h3>Вопрос внутри вопроса</h3>
<p>Когда вопрос начинается с вежливого оборота, дальше идёт обычный порядок слов, без инверсии.</p>
<div class="warn"><s>Do you know where is the ATM?</s> → <span class="en">Do you know where <b>the ATM is</b>?</span><br><s>Could you tell me what time does it start?</s> → <span class="en">Could you tell me what time <b>it starts</b>?</span></div>

<h3>Короткий хвостик right</h3>
<p>Вместо сложных разделительных вопросов в разговоре достаточно добавить right в конце.</p>
<div class="ex">You're coming, right? · It's free, right? · We said seven, right?<span class="ru">Ты придёшь, да? · Это бесплатно, да? · Мы договорились на семь, верно?</span></div>

<h3>Десять готовых вопросов на каждый день</h3>
<p class="small en">What do you do? · Where are you from? · How long have you been here? · What are you doing this weekend? · Have you been there? · How much is it? · How long does it take? · What do you think? · Can I ask you something? · How about you?</p>

/* ============ 8 ============ */
{id:"haveto", t:"have to / need to / must", s:"Как сказать «надо»", theory:`
<p>Важно: <b>have to</b> и <b>need to</b> — не модалы. Вопрос и отрицание у них делает <b>do / does / did</b>.</p>
<h3>have to — приходится, надо из-за обстоятельств</h3>
<table class="eng">
<tr><td class="ru">+</td><td>I have to wake up early. / He has to go.</td></tr>
<tr><td class="ru">−</td><td>I don't have to go. <span class="ru">— не обязан, могу не идти</span></td></tr>
<tr><td class="ru">?</td><td>Do you have to work on Saturday?</td></tr>
<tr><td class="ru">прошлое</td><td>I had to pay cash. / Did you have to wait?</td></tr>
<tr><td class="ru">будущее</td><td>I'll have to call them.</td></tr>
</table>
<h3>need to — нужно лично мне</h3>
<div class="ex">I need to get some sleep. · Do I need to book in advance?<span class="ru">Мне нужно поспать. · Мне нужно бронировать заранее?</span></div>
<h3>must — жёсткое требование, правило</h3>
<p class="small">О себе в разговоре почти не используется — говорят have to / need to. Must живёт в правилах и объявлениях: <span class="en">Passengers must wear a seatbelt.</span></p>
<div class="warn"><span class="en">You <b>mustn't</b> come.</span> = тебе нельзя приходить (запрет)<br>
<span class="en">You <b>don't have to</b> come.</span> = можешь не приходить (не обязан)</div>
<h3>must как уверенное предположение</h3>
<div class="ex">You must be tired. · He must be joking.<span class="ru">Ты, наверное, устал. · Он, должно быть, шутит.</span></div>
`,cards:[
{t:"mc",q:"___ you have to work tomorrow?",ru:"Тебе надо завтра работать?",o:["Do","Are","Have"],a:0,ex:"Have to — обычный глагол, вопрос через do."},
{t:"mc",q:"You ___ pay — it's free.",ru:"Тебе не нужно платить — это бесплатно.",o:["don't have to","mustn't","haven't to"],a:0,ex:"«Не обязан» = don't have to. Mustn't означало бы запрет: платить нельзя."},

{t:"in",task:"Переведи",ru:"Мне нужно поспать.",a:["i need to get some sleep","i need to sleep"],ex:"Личная потребность → need to."},

/* ============ 9 ============ */
{id:"cancould", t:"can / could", s:"Возможность, просьба, вариант", theory:`
<h3>can — факт возможности сейчас</h3>
<p class="en">I can fix this. · I can't hear you. · Can I use your charger?</p>
<p class="small">Три смысла: умение (I can drive), возможность (We can start now), разрешение (Can I sit here?).</p>
<h3>could — три разных смысла</h3>
<table class="eng">
<tr><td class="ru">вариант,<br>предложение</td><td>We could meet tomorrow.<br>We could try another place.</td></tr>
<tr><td class="ru">вежливая<br>просьба</td><td>Could you send me the file?<br>Could I ask you something?</td></tr>
<tr><td class="ru">умел<br>в прошлом</td><td>I could read at four.</td></tr>
</table>
<div class="warn">Про одно конкретное удавшееся действие в прошлом говорят <span class="en">was able to</span> или <span class="en">managed to</span>:<br>
<s>I could fix it yesterday</s> → <span class="en">I <b>was able to</b> fix it yesterday.</span><br>
Но в отрицании can работает нормально: <span class="en">I couldn't fix it.</span></div>
<h3>Будущее и прошлое от can</h3>
<p class="en">I'll be able to help tomorrow. · I wasn't able to log in.</p>
<div class="warn">Два модала подряд не ставятся: <s>I will can</s> → <span class="en">I'll be able to</span>.</div>
<h3>Лестница вежливости</h3>
<table class="eng">
<tr><td class="ru">прямо</td><td>Send me the file.</td></tr>
<tr><td class="ru">нейтрально</td><td>Can you send me the file?</td></tr>
<tr><td class="ru">вежливо</td><td>Could you send me the file?</td></tr>
<tr><td class="ru">очень вежливо</td><td>Would you mind sending me the file?</td></tr>
</table>
`,cards:[

{id:"should", t:"should", s:"Совет и «правильно так»", theory:`
<table class="eng">
<tr><td class="ru">+</td><td>You should try this sauce.</td></tr>
<tr><td class="ru">−</td><td>You shouldn't work so much.</td></tr>
<tr><td class="ru">?</td><td>Should I call him?</td></tr>
</table>
<h3>Три рабочих применения</h3>
<p><b>Спросить совета</b> — самый частый способ.</p>
<div class="ex">Should I take a taxi or walk?<span class="ru">Мне лучше взять такси или пойти пешком?</span></div>
<p><b>Дать совет мягко</b> — добавь probably.</p>
<div class="ex">You should probably ask her first.<span class="ru">Тебе, наверное, стоит сначала спросить её.</span></div>
<p><b>Сказать о себе «надо бы»</b> — и обычно не делаешь.</p>
<div class="ex">I should go to the gym more often.<span class="ru">Мне бы стоило чаще ходить в зал.</span></div>
<h3>Соседи по смыслу</h3>
<p class="small"><span class="en">You'd better…</span> — жёстче, с оттенком предупреждения: <span class="en">You'd better take an umbrella. You'd better not be late.</span><br>
<span class="en">If I were you, I'd…</span> — «на твоём месте я бы…».</p>

{id:"supposed", t:"be supposed to / used to", s:"«По идее должен» и «раньше делал»", theory:`
<h3>be supposed to — по идее должен, так заведено</h3>
<p>Движок здесь — <b>be</b>, поэтому вопрос и отрицание делает am / is / are.</p>
<table class="eng">
<tr><td class="ru">+</td><td>You're supposed to be here by 9.<br>It's supposed to rain today.</td></tr>
<tr><td class="ru">−</td><td>You're not supposed to park here. <span class="ru">— тут не положено</span></td></tr>
<tr><td class="ru">?</td><td>Am I supposed to sign this?</td></tr>
<tr><td class="ru">прошлое</td><td>I was supposed to call her yesterday. <span class="ru">— должен был и не сделал</span></td></tr>
</table>
<h3>used to — раньше делал, а сейчас нет</h3>
<table class="eng">
<tr><td class="ru">+</td><td>I used to play Counter-Strike a lot.</td></tr>
<tr><td class="ru">−</td><td>I didn't use to like coffee. <span class="ru">— без -d, did уже забрал прошедшее</span></td></tr>
<tr><td class="ru">?</td><td>Did you use to live there?</td></tr>
</table>
<div class="warn">Три похожие вещи, которые путают:<br>
<span class="en">used to do</span> — раньше делал<br>
<span class="en">be used to doing</span> — привык: I'm used to working at night<br>
<span class="en">get used to doing</span> — привыкаю: I'm getting used to the heat</div>

{id:"survival", t:"Набор выживания в разговоре", s:"Важнее грамматики: чем заполнять паузы", theory:`
<p>Разговор рвётся не потому, что ты ошибся во времени, а потому что ты замолчал. Эти фразы держат диалог.</p>
<h3>Выиграть время вместо паузы</h3>
<p class="en">Let me think… · How can I say it… · That's a good question · Hmm, well… · Actually… · You know… · I mean…</p>
<p class="small">Носители делают ровно так же. Это звучит нормально, а не глупо.</p>
<h3>Когда не понял</h3>
<p class="en">Sorry? · Sorry, I didn't catch that · Could you say that again? · Could you speak a little slower, please? · What does that mean?</p>
<div class="ex">Sorry, my English isn't great — I'm still learning.<span class="ru">Сразу снимает напряжение: люди переключаются на простой язык и становятся терпеливее.</span></div>
<h3>Не знаешь слово — описывай</h3>
<div class="formula">It's a thing you use for… · It's like… · It's when…</div>
<p class="small">Забыл «отвёртка» → <span class="en">It's a tool you use for screws.</span><br>Забыл «арендовать» → <span class="en">I pay for the house every month, but it's not mine.</span></p>
<p>Это главный навык живого общения: собеседник тут же подскажет слово, и оно запомнится навсегда.</p>
<h3>Держать разговор — кидай вопрос обратно</h3>
<p class="en">How about you? · What about you? · Really? Why? · How long have you been here? · What brought you here? · How do you like it here?</p>
<h3>Реакции, чтобы не молчать</h3>
<p class="en">Really? · That's cool · Makes sense · I know what you mean · Same here · Fair enough · No way · That sounds tough.</p>
<h3>Короткие ответы — тем же движком</h3>
<p class="small en">Do you like it? — Yes, I do. · Can you come? — No, I can't. · Are you coming? — Yes, I am. · Have you seen it? — Yes, I have.</p>
<p class="small">«Я тоже» → <span class="en">So do I / Me too.</span> «Я тоже нет» → <span class="en">Neither do I / Me neither.</span></p>

/* ============ 19 ============ */
{id:"contr", t:"Сокращения", s:"'d, 's, 've — что за ними прячется", theory:`
<p>Носители почти всегда говорят сокращённо. Полная форма звучит либо формально, либо как нажим: <span class="en">I <b>am</b> tired</span> — «да устал я».</p>
<table class="eng">
<tr><th>Сокр.</th><th>Что это</th><th>Пример</th></tr>
<tr><td>'m</td><td class="ru">am</td><td>I'm ready</td></tr>
<tr><td>'re</td><td class="ru">are</td><td>we're late · they're here</td></tr>
<tr><td>'ll</td><td class="ru">will</td><td>I'll call you · it'll be fine</td></tr>
<tr><td>'ve</td><td class="ru">have</td><td>I've seen it · we've met</td></tr>
<tr><td>n't</td><td class="ru">not</td><td>don't · can't · won't · isn't</td></tr>
</table>
<h3>Два хитрых: 'd и 's</h3>
<p><b>'d</b> — это либо <b>would</b>, либо <b>had</b>. Смотри на следующий глагол.</p>
<table class="eng">
<tr><td>'d + голый глагол</td><td class="ru">would: I'd go · we'd help · she'd say</td></tr>
<tr><td>'d + 3-я форма</td><td class="ru">had: I'd known · he'd left</td></tr>
<tr><td>'d better / 'd rather</td><td class="ru">устойчивые: had better, would rather</td></tr>
</table>
<p><b>'s</b> — это либо <b>is</b>, либо <b>has</b> (либо принадлежность).</p>
<table class="eng">
<tr><td>'s + прил. / -ing</td><td class="ru">is: he's tired · she's working</td></tr>
<tr><td>'s + 3-я форма</td><td class="ru">has: he's finished · she's gone</td></tr>
<tr><td>имя + 's + сущ.</td><td class="ru">принадлежность: Anna's car</td></tr>
</table>
<h3>could've / should've / would've</h3>
<p>Звучат слитно, почти как <span class="en">coulda, shoulda, woulda</span>. На слух похоже на <span class="en">of</span>, но писать <s>could of</s> нельзя — это грубая ошибка.</p>
<div class="ex">I should've known. · That could've been worse.</div>
<h3>Разговорные склейки</h3>
<table class="eng">
<tr><td>gonna</td><td class="ru">going to — I'm gonna check</td></tr>

/* ============ 20 ============ */
{id:"prep-time", t:"at / on / in", s:"Время и место — три предлога на всё", theory:`
<h3>Время</h3>
<table class="eng">
<tr><td>at</td><td class="ru">точка на часах: at 7, at noon, at midnight, at lunchtime, at night</td></tr>
<tr><td>on</td><td class="ru">день и дата: on Monday, on Friday night, on July 3rd, on my birthday</td></tr>
<tr><td>in</td><td class="ru">крупный отрезок: in July, in 2021, in summer, in the morning, in the evening</td></tr>
<tr><td>in</td><td class="ru">через сколько: in ten minutes, in two weeks</td></tr>
</table>
<div class="formula">Логика: точка → at, день → on, коробка побольше → in.</div>
<div class="warn">Без предлога вообще: <span class="en">next week · last year · this morning · today · tomorrow · every day</span><br><s>on the next week</s> → <span class="en">next week</span></div>
<h3>Место</h3>
<table class="eng">
<tr><td>at</td><td class="ru">точка, место события: at home, at work, at the office, at the bus stop, at the party, at the airport</td></tr>
<tr><td>on</td><td class="ru">поверхность и линия: on the table, on the wall, on the floor, on the beach, on the second floor, on the left</td></tr>
<tr><td>in</td><td class="ru">внутри объёма: in the room, in the car, in my bag, in Bali, in Russia</td></tr>
</table>
<div class="ex">in the car, but on the bus / on the plane / on the train<span class="ru">В машину садишься внутрь, в транспорт побольше — как бы на борт.</span></div>
<h3>Движение</h3>
<p class="small"><span class="en">to</span> — куда: go <b>to</b> work, come <b>to</b> the party.<br>
Но: <span class="en">go home</span>, <span class="en">go there</span> — без to.<br>
<span class="en">arrive <b>in</b></span> город/страна, <span class="en">arrive <b>at</b></span> здание/место. Никогда не arrive to.</p>
`,cards:[

/* ============ 21 ============ */
{id:"prep-verb", t:"Хвосты глаголов", s:"listen to, depend on, wait for", theory:`
<p>Русский и английский цепляют разные предлоги. Такие пары надо просто помнить целиком — вместе с предлогом.</p>
<table class="eng">
<tr><th>Правильно</th><th>Частая ошибка</th></tr>
<tr><td>listen <b>to</b> music</td><td class="ru">listen music</td></tr>
<tr><td>wait <b>for</b> me</td><td class="ru">wait me</td></tr>
<tr><td>it depends <b>on</b> you</td><td class="ru">depends from</td></tr>
<tr><td>look <b>for</b> keys (искать)</td><td class="ru">search keys</td></tr>
<tr><td>look <b>at</b> this (смотреть на)</td><td class="ru">look this</td></tr>
<tr><td>look <b>after</b> a child (присматривать)</td><td class="ru"></td></tr>
<tr><td>ask <b>for</b> help</td><td class="ru">ask help</td></tr>
<tr><td>pay <b>for</b> dinner</td><td class="ru">pay dinner</td></tr>
<tr><td>talk <b>to</b> him <b>about</b> it</td><td class="ru">talk with about</td></tr>
<tr><td>think <b>about</b> it</td><td class="ru">think of it — тоже есть, но чаще about</td></tr>
<tr><td>worry <b>about</b> money</td><td class="ru">worry for</td></tr>
<tr><td>apologize <b>for</b> being late</td><td class="ru"></td></tr>
<tr><td>explain it <b>to</b> me</td><td class="ru">explain me</td></tr>
<tr><td>agree <b>with</b> you</td><td class="ru">agree to you</td></tr>
</table>
<h3>Прилагательные тоже с хвостами</h3>
<p class="small en">interested <b>in</b> · good <b>at</b> · bad <b>at</b> · afraid <b>of</b> · tired <b>of</b> · married <b>to</b> · proud <b>of</b> · similar <b>to</b> · different <b>from</b> · responsible <b>for</b> · sorry <b>about</b> / <b>for</b></p>
<div class="warn">После предлога глагол всегда в -ing: <span class="en">interested in <b>working</b> · good at <b>cooking</b> · tired of <b>waiting</b></span></div>
<h3>А эти — наоборот, без предлога</h3>
<p class="small en">call me · answer the question · discuss the project · enter the room · marry her · visit us · tell me</p>

{id:"put", t:"Положить, накрыть, убрать", s:"put, take и бытовые действия", theory:`
<p>Половина бытовых глаголов в английском — это <b>put</b> или <b>take</b> плюс маленькое слово. Именно оно несёт смысл.</p>
<h3>put — поместить</h3>
<table class="eng">
<tr><td>put it <b>on</b> the table</td><td class="ru">положи на стол</td></tr>
<tr><td>put it <b>in</b> the drawer</td><td class="ru">положи в ящик</td></tr>
<tr><td>put it <b>under</b> the bed</td><td class="ru">подложи под кровать</td></tr>
<tr><td>put it <b>down</b></td><td class="ru">положи, поставь (из рук)</td></tr>
<tr><td>put it <b>back</b></td><td class="ru">верни на место</td></tr>
<tr><td>put it <b>away</b></td><td class="ru">убери (туда, где хранится)</td></tr>
<tr><td>put <b>on</b> a jacket</td><td class="ru">надень куртку</td></tr>
<tr><td>put <b>on</b> some music</td><td class="ru">включи музыку</td></tr>
<tr><td>put <b>out</b> the fire</td><td class="ru">потуши огонь</td></tr>
<tr><td>put it <b>off</b></td><td class="ru">отложи на потом</td></tr>
<tr><td>put up <b>with</b> it</td><td class="ru">терпи, мирись с этим</td></tr>
</table>
<h3>take — взять, забрать</h3>
<table class="eng">

<tr><td>take it <b>back</b></td><td class="ru">отнеси обратно</td></tr>

</table>
<div class="warn">lay и lie путают даже носители. Просто запомни два блока: <span class="en">lay something down</span> — кладу что-то. <span class="en">lie down</span> — ложусь сам.</div>
<h3>Подай, передай</h3>

{id:"colloc", t:"have / take / make / do", s:"Какой глагол с каким словом", theory:`
<p>Эти четыре глагола почти пустые по смыслу — важно, с какими словами они ходят. Учить парами.</p>
<table class="eng">
<tr><td><b>have</b></td><td class="ru">have breakfast / lunch / dinner · have a coffee · have a look · have a problem · have time · have fun · have a good time · have an idea · have a shower (брит.)</td></tr>
<tr><td><b>take</b></td><td class="ru">take a shower · take a taxi / bus · take a photo · take a break · take a look · take care · take your time · take medicine · take a seat</td></tr>
<tr><td><b>make</b></td><td class="ru">make a decision · make a mistake · make money · make coffee · make sense · make sure · make a call · make friends · make a mess · make progress</td></tr>
<tr><td><b>do</b></td><td class="ru">do the dishes · do the laundry · do homework · do exercise · do business · do someone a favour · do your best · do nothing</td></tr>
</table>
<div class="formula">Грубое правило: <b>make</b> — что-то создаётся, появляется результат. <b>do</b> — просто деятельность, работа, задача.</div>
<div class="ex">Does that make sense? · Make sure you lock the door. · Take your time. · Can you do me a favour?<span class="ru">Понятно объясняю? · Проверь, что закрыл дверь. · Не спеши. · Сделаешь одолжение?</span></div>
<div class="warn"><s>make a photo</s> → <span class="en">take a photo</span><br><s>do a mistake</s> → <span class="en">make a mistake</span><br><s>make homework</s> → <span class="en">do homework</span><br><s>take a decision</s> (брит. бывает) → чаще <span class="en">make a decision</span></div>

/* ============ 24 ============ */
{id:"articles", t:"a / the / без артикля", s:"То, чего в русском просто нет", theory:`
<div class="formula"><b>a / an</b> — один из многих, слышишь впервые.<br><b>the</b> — тот самый, оба понимаем какой.<br><b>ничего</b> — вообще, как явление.</div>
<h3>a / an</h3>
<p class="small">Впервые упомянутое: <span class="en">I bought a laptop.</span><br>
Профессия и роль: <span class="en">I'm a designer. He's a friend of mine.</span><br>
Один штука: <span class="en">Give me a minute. I have a question.</span><br>
<span class="en">an</span> перед гласным звуком: an hour, an idea, an email.</p>
<h3>the</h3>
<p class="small">Уже упомянутое: <span class="en">I bought a laptop. <b>The</b> laptop is fast.</span><br>
Единственное в мире или в контексте: <span class="en">the sun, the kitchen, the airport, the beach</span><br>
Превосходная степень и порядок: <span class="en">the best, the first, the same</span><br>
Уточнение через of: <span class="en">the price of the room</span></p>
<h3>Ничего</h3>
<p class="small">Множественное вообще: <span class="en">I like dogs. Designers are expensive.</span><br>
Неисчисляемое вообще: <span class="en">water, money, time, work, advice, information, music</span><br>
Города и страны: <span class="en">in Bali, from Russia</span> (но: the USA, the UK)<br>
Устойчивые места: <span class="en">at home, at work, to school, in bed, by car</span><br>
Еда и приёмы пищи: <span class="en">for breakfast, I like coffee</span></p>
<div class="ex">I need a car. (какую-нибудь) — I need the car. (нашу, ту самую)<span class="ru">Разница только в артикле — а смысл разный.</span></div>
<div class="warn">Слова, которые в английском неисчисляемые и не имеют -s: <span class="en">advice, information, money, news, furniture, knowledge, feedback</span>.<br><s>an advice</s> → <span class="en">a piece of advice</span> · <s>informations</s> → <span class="en">information</span></div>
`,cards:[

{id:"there", t:"there is / it is", s:"Как сказать «есть» и «находится»", theory:`
<p>Русское «есть / имеется / находится» — это <b>there is / there are</b>. Дословный перевод через have здесь не работает.</p>
<table class="eng">
<tr><td class="ru">ед. ч.</td><td>There is a problem. · There's a cafe nearby.</td></tr>
<tr><td class="ru">мн. ч.</td><td>There are two options. · There are a lot of people.</td></tr>
<tr><td class="ru">−</td><td>There isn't any milk. · There aren't any tickets left.</td></tr>
<tr><td class="ru">?</td><td>Is there a toilet here? · Are there any questions?</td></tr>
<tr><td class="ru">прошлое</td><td>There was a problem. · There were a lot of people.</td></tr>
<tr><td class="ru">будущее</td><td>There will be a meeting at 5.</td></tr>
</table>
<div class="warn"><s>In my city are many cafes</s> → <span class="en">There are a lot of cafes in my city.</span><br><s>My city has many cafes</s> — грамматически можно, но звучит не по-английски.</div>
<h3>there is или have?</h3>
<p class="small"><span class="en">I have a car.</span> — владею.<br><span class="en">There's a car outside.</span> — машина есть, стоит там.</p>
<h3>it — про уже известное</h3>
<p class="small">Погода, время, расстояние, оценка: <span class="en">It's hot today. · It's 5 o'clock. · It's 20 minutes from here. · It's easy. · It's worth it.</span></p>
<div class="ex">There's a new cafe on the corner. It's really good.<span class="ru">Сначала there is — вводим новое. Потом it — говорим про уже известное.</span></div>
<h3>some / any</h3>
<p class="small"><span class="en">some</span> в утверждении: There's some water left.<br>
<span class="en">any</span> в вопросе и отрицании: Is there any water? · There isn't any water.<br>
<span class="en">some</span> в вопросе-предложении: Would you like some coffee?</p>
`,cards:[

{id:"linkers", t:"Как продлить фразу", s:"Связки: because, so, although, actually", theory:`
<p>Главная причина, по которой разговор глохнет, — ответы в два слова. Собеседник спрашивает, ты отвечаешь <span class="en">Yes, I like it</span>, и повисает пауза. Дело не в словарном запасе, а в связках: именно они позволяют приклеить к первому предложению второе и третье.</p>

<h3>Четыре базовые склейки</h3>
<table class="eng">
<tr><td>and</td><td class="ru">и — просто добавляем: It's quiet <b>and</b> the food is cheap.</td></tr>
<tr><td>but</td><td class="ru">но — противопоставляем: I like it here, <b>but</b> the traffic is crazy.</td></tr>
<tr><td>because</td><td class="ru">потому что — причина: I stayed home <b>because</b> I was tired.</td></tr>
<tr><td>so</td><td class="ru">поэтому — следствие: I was tired, <b>so</b> I stayed home.</td></tr>
</table>
<p class="small">Because и so — это одна и та же мысль, развёрнутая в разные стороны. После because идёт причина, после so — результат.</p>

<h3>Ещё восемь, которые звучат постоянно</h3>
<table class="eng">
<tr><td>that's why</td><td class="ru">вот почему: I don't drive. That's why I use Grab.</td></tr>
<tr><td>also</td><td class="ru">ещё, тоже (в середине): I also work with clients.</td></tr>
<tr><td>too / as well</td><td class="ru">тоже (в конце): I like it too. · I was there as well.</td></tr>
<tr><td>although / even though</td><td class="ru">хотя: Although it's expensive, it's worth it.</td></tr>
<tr><td>though</td><td class="ru">хотя, но (в конце — очень разговорно): It's expensive, though.</td></tr>
<tr><td>actually</td><td class="ru">на самом деле, вообще-то: Actually, I've never tried it.</td></tr>
<tr><td>by the way</td><td class="ru">кстати: By the way, did you call him?</td></tr>
<tr><td>anyway</td><td class="ru">в общем, ладно (возвращает к теме или закрывает её): Anyway, what about you?</td></tr>
</table>

<h3>Схема развёрнутого ответа</h3>
<div class="formula">Факт → причина или деталь → мнение или вопрос обратно</div>
<p>Вопрос: <span class="en">Do you like living in Bali?</span></p>
<div class="ex">Yeah, I like it a lot. It's quiet where I live and the food is cheap. The traffic is crazy, though. How about you?<span class="ru">Да, очень нравится. Там, где я живу, тихо, и еда дешёвая. Правда, движение сумасшедшее. А тебе?</span></div>
<p class="small">Три предложения вместо одного — и разговор поехал дальше. Это и есть весь секрет.</p>

<h3>Заполнители, чтобы не молчать между мыслями</h3>
<p class="small en">I mean… · like… · you know… · kind of… · or something · stuff like that</p>
<div class="ex">I work in IT — design, websites, stuff like that.<span class="ru">Я в IT — дизайн, сайты, всё такое.</span></div>
`,cards:[

{t:"in",task:"Соедини в одно предложение",ru:"Мне здесь нравится, но движение сумасшедшее.",a:["i like it here, but the traffic is crazy","i like it here but the traffic is crazy"],ex:"But приклеивает противоположную мысль и сразу удлиняет ответ вдвое.\nТот же смысл разговорнее: I like it here. The traffic is crazy, though."},

{id:"relative", t:"Который, где, что", s:"Как описать вещь и человека", theory:`
<p>Это то, что даёт длинные предложения и спасает, когда забыл слово. Русское «который» превращается в четыре разных слова.</p>
<table class="eng">
<tr><td>who</td><td class="ru">про людей: the guy <b>who</b> lives next door — парень, который живёт по соседству</td></tr>
<tr><td>that</td><td class="ru">про всё подряд, в разговоре чаще всего: the thing <b>that</b> I told you about</td></tr>
<tr><td>which</td><td class="ru">про вещи, чуть формальнее: the app <b>which</b> we use</td></tr>
<tr><td>where</td><td class="ru">про места: the place <b>where</b> we met</td></tr>
<tr><td>when</td><td class="ru">про время: the day <b>when</b> we arrived</td></tr>
</table>
<p class="small">В живой речи that спокойно заменяет who и which почти везде. Если сомневаешься — ставь that.</p>

<h3>Когда «который» можно вообще выбросить</h3>
<p>Если сразу после него идёт новое действующее лицо — слово можно убрать, и так говорят чаще.</p>
<table class="eng">
<tr><td>The film <b>(that)</b> we watched was great.</td><td class="ru">фильм, который мы смотрели — убрать можно, дальше идёт we</td></tr>
<tr><td>The guy <b>who</b> called me…</td><td class="ru">убрать нельзя: who сам и есть тот, кто звонил</td></tr>
</table>

<h3>Главное применение: описать то, чего не знаешь</h3>
<div class="formula">It's a thing that… · It's a place where… · It's the guy who… · It's when you…</div>
<div class="ex">It's a tool that you use for screws.<span class="ru">Это инструмент, которым закручивают винты. (отвёртка)</span></div>
<div class="ex">It's a place where you leave your motorbike.<span class="ru">Это место, где оставляют байк. (парковка)</span></div>
<div class="ex">It's when you can't sleep at night.<span class="ru">Это когда не можешь спать ночью. (бессонница)</span></div>
<p>Собеседник почти всегда подскажет нужное слово, и оно запомнится навсегда — гораздо лучше, чем из словаря.</p>

<h3>Ещё пара полезных склеек</h3>
<p class="small"><span class="en">the one with…</span> — тот, который с: the guy with the beard, the one with the blue cover.<br>
<span class="en">something like…</span> — что-то вроде: it's something like a scooter.<br>
<span class="en">kind of a…</span> — типа: it's kind of a café, but they also sell books.</p>

{id:"story", t:"Рассказать историю", s:"Past Continuous и порядок повествования", theory:`
<p>Половина живого разговора — это короткие истории: что случилось, где был, как получилось. Для них нужны две вещи: фон и порядок.</p>

<h3>Фон: Past Continuous</h3>
<div class="formula">was / were + глагол с -ing</div>
<p>Длинное действие, которое шло в тот момент, когда случилось что-то короткое.</p>
<div class="ex">I <b>was working</b> when he called.<span class="ru">Я работал, когда он позвонил. — работа шла долго, звонок случился в один момент</span></div>
<div class="ex">We <b>were having</b> dinner when the power went out.<span class="ru">Мы ужинали, когда выключили свет.</span></div>
<table class="eng">
<tr><td><b>when</b> + короткое событие</td><td class="ru">when he called, when it happened</td></tr>
<tr><td><b>while</b> + длинный фон</td><td class="ru">while I was working, while we were driving</td></tr>
</table>
<p class="small">Одно и то же можно сказать с любой стороны: <span class="en">I was working when he called</span> = <span class="en">He called while I was working.</span></p>

<h3>Порядок рассказа</h3>
<table class="eng">
<tr><td>So yesterday…</td><td class="ru">короче, вчера…</td></tr>
<tr><td>Then… / And then…</td><td class="ru">потом…</td></tr>
<tr><td>After that…</td><td class="ru">после этого…</td></tr>
<tr><td>Suddenly…</td><td class="ru">вдруг…</td></tr>
<tr><td>It turned out…</td><td class="ru">оказалось, что…</td></tr>
<tr><td>In the end…</td><td class="ru">в итоге…</td></tr>
<tr><td>Luckily / Unfortunately…</td><td class="ru">к счастью / к сожалению…</td></tr>
</table>

<h3>Готовый шаблон истории</h3>
<div class="ex">So yesterday I was riding home when it started raining. I didn't have a raincoat, so I stopped at a warung. It turned out the owner was from Java and we talked for an hour. In the end I got home really late, but it was fun.<span class="ru">Короче, вчера я ехал домой, и тут пошёл дождь. Дождевика не было, поэтому я остановился у варунга. Оказалось, хозяин с Явы, и мы проболтали час. В итоге домой я добрался очень поздно, но было классно.</span></div>
<p class="small">Пять предложений, простые времена, две связки. Именно так и звучит нормальный рассказ — сложных конструкций там нет.</p>

<h3>Реакции слушателя</h3>
<p class="small en">Really? · What happened next? · No way! · That's crazy · And then what? · How did it end?</p>

{id:"compare", t:"Сравнение", s:"дешевле, лучше, слишком, недостаточно", theory:`
<h3>Короткие слова получают -er</h3>
<p>Одно-двусложные прилагательные: cheap → cheap<b>er</b>, fast → faster, small → smaller. После них ставится <b>than</b>.</p>
<div class="ex">It's cheaper than Ubud. · This one is faster.<span class="ru">Это дешевле, чем Убуд. · Этот быстрее.</span></div>
<p class="small">Мелочи написания: big → bigger (согласная удваивается), easy → easier (y меняется на i), nice → nicer.</p>

<h3>Длинные слова получают more</h3>
<p>Три слога и больше: <b>more</b> expensive, more interesting, more comfortable.</p>
<div class="ex">It's more expensive than I expected.<span class="ru">Это дороже, чем я ожидал.</span></div>
<div class="warn">Вместе они не ставятся: <s>more cheaper</s> → <span class="en">cheaper</span>.</div>

<h3>Самый — the -est или the most</h3>
<div class="ex">the cheapest place · the fastest way · the most expensive restaurant<span class="ru">самое дешёвое место · самый быстрый путь · самый дорогой ресторан</span></div>
<p class="small">Артикль the здесь обязателен: the best, the worst, the first.</p>

<h3>Четыре неправильных, которые нужны постоянно</h3>
<table class="eng">
<tr><td>good</td><td>better</td><td>the best</td></tr>
<tr><td>bad</td><td>worse</td><td>the worst</td></tr>
<tr><td>far</td><td>further</td><td>the furthest</td></tr>
<tr><td>many / much</td><td>more</td><td>the most</td></tr>
</table>

<h3>Такой же — as … as</h3>
<div class="ex">It's as good as the other one. · It's not as expensive as I thought.<span class="ru">Он такой же хороший, как другой. · Это не так дорого, как я думал.</span></div>

<h3>Слишком и недостаточно</h3>
<table class="eng">
<tr><td>too + прилагательное</td><td class="ru">слишком: too expensive, too hot, too far</td></tr>

<tr><td>enough + существительное</td><td class="ru">enough money, enough time</td></tr>
</table>
<div class="warn">Too и very — разные вещи. <span class="en">Very hot</span> — очень жарко, но нормально. <span class="en">Too hot</span> — жарко настолько, что уже проблема.</div>

<h3>Насколько сильнее</h3>
<p class="small"><span class="en">much cheaper</span> — намного дешевле · <span class="en">a bit better</span> — чуть лучше · <span class="en">way faster</span> — сильно быстрее (разговорно)</p>

{id:"hedge", t:"Смягчить и усилить", s:"kind of, a bit, pretty, I guess", theory:`
<p>Когда говоришь простыми словами, фразы получаются категоричными: <span class="en">It's bad. I don't like it. No.</span> По-английски это звучит резче, чем ты имеешь в виду. Смягчители — это то, что делает речь нормальной, а не рубленой.</p>

<h3>Смягчители</h3>
<table class="eng">
<tr><td>kind of / sort of</td><td class="ru">типа, вроде, как бы: It's kind of weird. · I kind of like it.</td></tr>
<tr><td>a bit / a little</td><td class="ru">немного: I'm a bit tired. · It's a bit expensive.</td></tr>
<tr><td>not really</td><td class="ru">не особо: — Do you like it? — Not really.</td></tr>
<tr><td>I guess</td><td class="ru">наверное, пожалуй: I guess so. · I guess we could try.</td></tr>
<tr><td>maybe / probably</td><td class="ru">может быть / скорее всего</td></tr>
<tr><td>to be honest</td><td class="ru">если честно: To be honest, I didn't like it.</td></tr>
</table>
<div class="ex">It's bad. → It's not great, to be honest.<span class="ru">Второй вариант — то же самое, но без грубости.</span></div>
<div class="ex">No, I don't want to. → I'd rather not, if that's ok.<span class="ru">Мягкий отказ вместо резкого.</span></div>

<h3>Усилители</h3>
<table class="eng">
<tr><td>really</td><td class="ru">очень, реально: really good, really tired</td></tr>
<tr><td>pretty</td><td class="ru">довольно (не «красиво»!): pretty good, pretty expensive</td></tr>
<tr><td>quite</td><td class="ru">довольно: quite nice, quite far</td></tr>
<tr><td>so</td><td class="ru">так, настолько: I'm so tired.</td></tr>
<tr><td>absolutely / totally</td><td class="ru">абсолютно, полностью: Totally agree.</td></tr>
</table>
<p class="small">Осторожно с very: оно ставится только перед прилагательным (very good), но не перед глаголом. «Очень люблю» — это <span class="en">really like</span> или <span class="en">like it a lot</span>.</p>

<h3>Шкала оценки, чтобы не повторять good и bad</h3>
<p class="small en">terrible → not great → okay → pretty good → really good → amazing</p>
<div class="ex">— How was the food? — Pretty good, actually.<span class="ru">— Как еда? — Вообще-то очень даже.</span></div>

{id:"about-me", t:"Рассказ о себе", s:"Десять тем, которые закрывают полразговора", theory:`
<p>Любое знакомство идёт по одним и тем же десяти темам. Если ответы на них готовы и проговорены вслух, половина разговора перестаёт быть импровизацией. Ниже — образцы, под которые нужно подставить своё и произнести раз десять.</p>

<h3>1. Кто ты</h3>
<div class="ex">I'm Ivan. I'm from Russia, but I've been living in Bali for a while.</div>
<h3>2. Чем занимаешься</h3>
<div class="ex">I work in IT. I run a small studio — we build websites and online stores. I do a bit of everything: design, sales, talking to clients.</div>
<h3>3. Почему Бали</h3>
<div class="ex">We moved here because of the weather and the pace. Back home the winters are long. Here I can work and still go to the beach in the evening.</div>
<h3>4. Как долго и что дальше</h3>
<div class="ex">I've been here for a couple of years. I'm not sure how long we'll stay — we'll see how it goes.</div>
<h3>5. Семья</h3>
<div class="ex">I'm here with my partner and our kid. He keeps us busy.</div>
<h3>6. Как прошёл день</h3>
<div class="ex">Nothing special. I worked in the morning, then we went out for lunch. In the evening I was learning English, actually.</div>
<h3>7. Планы</h3>
<div class="ex">I'm going to start my own product — something small that I can sell online. I'm a bit tired of client work, to be honest.</div>
<h3>8. Свободное время</h3>
<div class="ex">I like cooking, and I take photos sometimes. Nothing serious, just for fun.</div>
<h3>9. Мнение о чём-то (тут почти всегда спрашивают про AI)</h3>
<div class="ex">I use it every day for work. I'd say it changes design a lot — the simple stuff is getting automated. It's kind of scary and interesting at the same time.</div>
<h3>10. Что нравится и не нравится здесь</h3>
<div class="ex">The food is great and people are friendly. The traffic is crazy, though. And the rainy season is tough.</div>

<h3>Как этим пользоваться</h3>
<p>Возьми каждый пункт и перепиши под себя — своими словами, максимально простыми. Потом проговори вслух, не подглядывая. Цель не выучить наизусть, а чтобы в разговоре первая фраза выходила сама, а дальше мысль поехала.</p>
<div class="formula">Отвечай по схеме: факт → деталь → и верни вопрос собеседнику.</div>
<p class="small en">…What about you? · …And you? · …How about you?</p>
