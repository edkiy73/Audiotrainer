"haveto#6":"Отрицание строит помощник do, потому что have to — обычный глагол.\nНо смысл при этом меняется: I have to go — мне надо идти, I don't have to go — я не обязан идти.",

"cancould#0":"Could — вежливая версия can, звучит мягче в просьбах.\nПосле модального глагола идёт голая форма без to: could you help, а не could you to help.",
"cancould#1":"Couldn't — прошедшая форма от can't, в отрицании она работает свободно.\nЕщё: I couldn't sleep. I couldn't find it. I couldn't come yesterday.",
"cancould#2":"Could предлагает вариант: «мы могли бы, если хочешь».\nГлагол после него голый: we could meet, we could try, we could ask.",
"cancould#3":"Два модальных глагола подряд ставить нельзя, поэтому будущее от can выражается через be able to.\nТо же в прошлом: I wasn't able to log in. — Я не смог войти.",
"cancould#4":"Восприятие — слышу, вижу, чувствую — идёт с can, а не в форме с -ing.\nI can hear you. I can see it. Фраза I'm not hearing you звучит неправильно.",
"cancould#5":"Про одно конкретное действие, которое удалось в прошлом, говорят was able to или managed to.\nCould в утверждении означает «умел вообще, был способен»: I could swim at five.",
"cancould#6":"Готовая фраза, которую стоит выучить целиком — она понадобится в первом же разговоре с носителем.\nA little и a bit смягчают просьбу: без них звучит требовательнее.",

"should#0":"Should I…? — стандартный способ спросить совета или разрешения у собеседника.\nЕщё: Should I wait? Should I bring anything? Should I call her first?",
"should#1":"Отрицание вешается на сам модальный глагол: should not, сокращённо shouldn't.\nГлагол после него голый: shouldn't drink, shouldn't work, shouldn't go.",
"should#2":"Совет строится проще некуда: You should + голый глагол.\nСмягчить можно словом probably: You should probably try it.",
"should#3":"If I were you — устойчивая формула, в ней стоит were при любом подлежащем, даже с I.\nПолностью: If I were you, I'd talk to him. — На твоём месте я бы с ним поговорил.",
"should#4":"Should о себе означает «надо бы» — то, что правильно, но обычно не делается.\nЕщё: I should call my mom. I should go to bed earlier.",
"should#5":"Had better — предупреждение с оттенком «а то будут проблемы», жёстче обычного совета.\nВ речи почти всегда сокращается: you'd better, we'd better. Отрицание: you'd better not.",

"would#0":"I'd like — вежливая замена прямому I want, которое в кафе и магазине звучит резковато.\nПолная форма: I would like. Дальше можно ставить существительное или глагол с to: I'd like to book a table.",
"would#1":"I'd rather + голый глагол означает «я бы лучше».\nЕсли брать prefer, конструкция другая: I'd prefer to stay. Отрицание: I'd rather not.",
"would#2":"Классическая схема мечты с препятствием: I would…, but…\nWould здесь означает, что действие возможно только при условии, которое не выполнено.",
"would#3":"После mind всегда идёт форма с -ing: mind closing, mind waiting, mind helping.\nИ помни про ответ: согласие звучит как Not at all — «да без проблем».",
"would#4":"I'd say — способ высказать мнение или прикинуть цифру, не утверждая наверняка.\nЕщё: I'd say it's fine. I'd say about fifty dollars.",
"would#5":"Would you like — вежливое приглашение или предложение. Отвечают обычно I'd love to или I'd rather not.\nDo you want to тоже возможно, но звучит прямее и проще.",
"would#6":"I'd rather not — вежливый отказ без объяснения причины, полностью нормальный в разговоре.\nМожно добавить смягчение: I'd rather not, if that's ok.",

"supposed#0":"Used to описывает прошлую привычку, которой сейчас нет.\nПосле used to всегда голая форма глагола: used to play, used to smoke, used to live there.",
"supposed#1":"Конструкция состоит из трёх частей: форма be + supposed to + голый глагол.\nОна означает «по идее должен» — по договорённости, по правилам или по ожиданиям других.",
"supposed#2":"Was supposed to означает обязательство в прошлом, которое чаще всего не выполнено.\nЕщё: I was supposed to send it yesterday. — Я должен был отправить это вчера.",
"supposed#3":"Помощник did уже показывает прошедшее время, поэтому use остаётся без -d.\nВопрос строится так же: Did you use to live there?",
"supposed#4":"Be used to означает «привык, для меня это нормально», и после него идёт форма с -ing.\nНе путать с used to do — «раньше делал». Сравни: I used to work at night (раньше работал) и I'm used to working at night (привык работать).",
"supposed#5":"Not supposed to — мягкое «не положено»: правило или ожидание, а не запрет полиции.\nЕщё: You're not supposed to smoke here. — Здесь вроде как не курят.",
"supposed#6":"В этой конструкции помощник — форма be, поэтому вперёд выходит am, is или are.\nПолностью: Am I supposed to bring anything? — Мне что-то принести?",

"perfmodal#0":"Should have + третья форма означает сожаление: надо было сделать, а не сделал.\nВ речи звучит слитно — should've. Ещё: I should've asked. I should've left earlier.",
"perfmodal#1":"Could have + третья форма — возможность, которой не воспользовались.\nЧасто звучит как мягкий упрёк: You could have told me. — Мог бы и сказать мне.",

"perfmodal#3":"Would have + третья форма описывает то, что случилось бы при других обстоятельствах.\nЧасто идёт в паре с but: I would have helped, but I didn't know.",
"perfmodal#4":"Didn't have to означает, что обязанности не было — и ты этого не делал.\nShouldn't have brought означало бы упрёк: зря принёс. Разница важная.",
"perfmodal#5":"Shouldn't have + третья форма: сделал и жалеешь.\nЕщё: I shouldn't have said that. We shouldn't have come so early.",

"cond#0":"После if будущее время не ставится — вместо него идёт настоящее, хотя речь о будущем.\nПравило простое: will живёт только во второй части предложения. If it rains, I'll stay home.",
"cond#1":"Нереальная ситуация в настоящем: условие ставится в прошедшую форму, а результат — через would.\nПри этом речь идёт о сегодняшнем дне, а не о прошлом: времени нет прямо сейчас.",
"cond#2":"If I were you — устойчивая формула совета, в ней всегда were.\nWas в разговоре тоже слышно, но were считается правильным и звучит грамотнее.",

"get#5":"Get + вещь + третья форма означает, что действие делает кто-то другой, а не ты сам.\nЕщё: I need to get the bike fixed. — Надо, чтобы байк починили.",

"caus#2":"После let тоже голая форма: let me help, let me check, let me know.\nLet me know — «дай знать» — одна из самых частых фраз в переписке.",

"prep-time#3":"At work, at home, at school — устойчивые сочетания, артикль в них не ставится.\nЕсли говорить о здании как о месте, появится the: at the office, at the airport.",

"prep-verb#0":"Listen всегда тянет за собой to: listen to music, listen to me, listen to the radio.\nБез to фраза звучит незаконченной, как «слушать» без дополнения.",

function buildAiPrompt(t){
  return "You are my English conversation partner. I'm a Russian-speaking learner, level A2\u2013B1.\n\n"+
"Topic for this conversation: "+t.topic+".\n\n"+
"Please:\n"+
"- Ask me one question at a time, in simple English. Wait for my answer before asking the next one.\n"+
"- If I make a clear grammar or word-choice mistake, correct it in one short line (for example: \"Small correction: it's 'I have been' not 'I have be'.\"), then continue the conversation naturally \u2014 don't stop for a full grammar lecture.\n"+
"- If my answer is fine, just react naturally and move on.\n"+
"- Keep your own sentences short and simple, A2\u2013B1 level.\n"+
"- Ask about 6\u20138 questions total, then wrap up with a short, encouraging summary IN RUSSIAN: what went well, and 1\u20132 things to pay attention to next time.\n\n"+
"Try to naturally use these constructions in your questions, since I've been practicing them:\n"+t.focus.map(f=>"\u2022 "+f).join("\n")+"\n\n"+
"Let's start \u2014 greet me and ask your first question.";
}
async function copyPrompt(text,btn){
  const done=()=>{const old=btn.innerHTML;btn.innerHTML=ICON.check+" Скопировано";setTimeout(()=>{btn.innerHTML=old;},1600);};
  try{await navigator.clipboard.writeText(text);done();return;}catch(e){}
  try{
    const ta=document.createElement("textarea");
    ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();document.execCommand("copy");
    document.body.removeChild(ta);done();
  }catch(e){btn.innerHTML="Не удалось скопировать — выдели текст вручную";}
}
function viewAi(id){
  const t=AI_TALKS.find(x=>x.id===id),prompt=buildAiPrompt(t),done=!!S.ai[id];
  setHead("Разговор с ИИ",t.title);
  app.innerHTML=backBtn("lessons","Уроки")+
    '<h2 style="margin-top:10px">'+esc(t.title)+'</h2>'+
    '<div class="tags" style="margin-bottom:16px">'+t.chips.map(c=>'<span>'+esc(c)+'</span>').join("")+'</div>'+
    '<p class="small">Скопируй промпт ниже и вставь в Gemini — текстом или в голосовом режиме. Дальше говоришь с ним по-английски: он будет задавать вопросы, мягко поправлять и продолжать разговор.</p>'+
    '<p class="small">Это открытая практика без автопроверки — как «Слабые места» и дриллы, честность здесь важнее галочки.</p>'+
    '<div class="promptbox" id="pbox">'+esc(prompt)+'</div>'+
    '<div style="height:14px"></div>'+
    '<button class="btn" id="copyBtn">'+ICON.layers+' Скопировать промпт</button>'+
    '<div style="height:10px"></div>'+
    '<a class="btn sec" href="https://gemini.google.com/app" target="_blank" rel="noopener" style="text-decoration:none;box-sizing:border-box">'+ICON.chevR+' Открыть Gemini</a>'+
    '<div style="height:10px"></div>'+
    '<button class="btn '+(done?"sec":"ghost")+'" id="doneBtn">'+(done?ICON.check+" Пройдено \\u2014 отметить заново":"Отметить как пройдено")+'</button>';
  document.getElementById("copyBtn").onclick=e=>copyPrompt(prompt,e.currentTarget);
  document.getElementById("doneBtn").onclick=()=>{
    S.ai[id]={date:today()};saveState();viewAi(id);
  };
}

function stripTime(ws){

  // однословные и двухсловные обстоятельства времени свободно двигаются по всей фразе,

  while(ch){

      if(TIME2A[a[i]]&&TIME2B[a[i+1]]){a.splice(i,2);ch=true;break;}

const SKIP={BUTTON:1,INPUT:1,SCRIPT:1,STYLE:1,SVG:1};
function ttsify(root){
  const nodes=[],w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  while(w.nextNode()){
    const n=w.currentNode;
    if(!/[A-Za-z]{2}/.test(n.nodeValue))continue;
    let el=n.parentElement,bad=false;
    while(el&&el!==root.parentElement){
      if(SKIP[el.tagName]||el.classList&&(el.classList.contains("ru")||el.classList.contains("w")||el.classList.contains("no-tts"))){bad=true;break;}
      el=el.parentElement;
    }
    if(!bad)nodes.push(n);
  }
  nodes.forEach(n=>{
    const parts=n.nodeValue.split(/([A-Za-z][A-Za-z'\u2019]*)/);
    if(parts.length<2)return;
    const f=document.createDocumentFragment();
    parts.forEach((p,i)=>{
      if(!p)return;
      if(i%2===1){const s=document.createElement("span");s.className="w";s.textContent=p;f.appendChild(s);}
      else f.appendChild(document.createTextNode(p));
    });
    n.parentNode.replaceChild(f,n);
  });
}

/* блок теории вида "A · B · C" с переводом "A' · B' · C'" режем на отдельные пары */
function splitPair(en,ru,out){
  en=String(en).replace(/\s+/g," ").trim();
  ru=String(ru).replace(/\s+/g," ").trim();
  if(!en||!ru)return;
  const cut=(t,sep)=>t.split(sep).map(x=>x.trim()).filter(Boolean);
  let ep=cut(en,/\s*[·•]\s*/),rp=cut(ru,/\s*[·•]\s*/);
  if(ep.length!==rp.length){ep=[en];rp=[ru];}
  for(let i=0;i<ep.length;i++){
    let e=cut(ep[i],/(?<=[.!?])\s+(?=[A-Z"'\u2014])/),r=cut(rp[i],/(?<=[.!?])\s+(?=[А-ЯЁA-Z])/);
    if(e.length!==r.length){e=[ep[i]];r=[rp[i]];}
    for(let k=0;k<e.length;k++){
      const ee=e[k],rr=r[k];
      if(!/[A-Za-z]{2}/.test(ee))continue;
      if(!/[\u0400-\u04FF]/.test(rr))continue;
      if(ee.length<6||ee.length>85)continue;
      out.push([ee,rr]);
    }
  }
}
function buildExamples(){
  if(EXPOOL)return EXPOOL;
  const pool=[];
  PHRASES.forEach(g=>g.items.forEach(i=>splitPair(i[0],i[1],pool)));
  LESSONS.forEach(l=>{
    l.cards.forEach(c=>{
      if(c.q&&c.ru&&/[A-Za-z]{2}/.test(c.q)&&/[\u0400-\u04FF]/.test(c.ru)&&c.q.indexOf("___")<0)
        splitPair(c.q,c.ru,pool);
      // правильные ответы заданий на перевод — это готовые пары «фраза + перевод»
      if(c.t!=="mc"&&c.ru&&Array.isArray(c.a)&&c.a[0]&&/[\u0400-\u04FF]/.test(c.ru)&&!c.q){
        let en=c.a[0].replace(/\bi\b/g,"I").replace(/\bi'/g,"I'").replace(/\bin it\b/g,"in IT").replace(/\bbali\b/gi,"Bali").replace(/\benglish\b/gi,"English").replace(/\brussia\b/gi,"Russia").replace(/\bjapan\b/gi,"Japan").replace(/\bfriday\b/gi,"Friday").replace(/\bmonday\b/gi,"Monday").replace(/\bspanish\b/gi,"Spanish").replace(/\bubud\b/gi,"Ubud");
        en=en.charAt(0).toUpperCase()+en.slice(1);
        const isQ=/\?/.test(c.ru)||/^(do|does|did|are|is|am|have|has|can|could|will|would|should|what|where|when|why|how|who|which)\b/i.test(c.a[0]);
        if(!/[.!?]$/.test(en))en+=isQ?"?":".";
        splitPair(en,c.ru,pool);
      }
    });
    try{
      const d=document.createElement("div");d.innerHTML=l.theory;
      d.querySelectorAll(".ex").forEach(el=>{
        const ruEl=el.querySelector(".ru");if(!ruEl)return;
        const ru=ruEl.textContent.replace(/\s+/g," ").trim();
        const c2=el.cloneNode(true);c2.querySelectorAll(".ru").forEach(x=>x.remove());
        const en=c2.textContent.replace(/\s+/g," ").trim();
        splitPair(en,ru,pool);
      });
    }catch(e){}
  });
  EXPOOL=pool;return pool;
}
function findExamples(word,max){
  const w=word.toLowerCase().replace(/[\u2019]/g,"'").replace(/[^a-z']/g,"");
  if(w.length<2)return [];
  const forms={};forms[w]=1;
  [w+"s",w+"es",w+"ed",w+"ing",w.replace(/y$/,"ies"),w.replace(/e$/,"ing")].forEach(f=>forms[f]=1);
  const base=w.replace(/(ies|es|ed|ing|s)$/,"");if(base.length>2)forms[base]=1;
  let re;try{re=new RegExp("\\b("+Object.keys(forms).join("|")+")\\b","i");}catch(e){return [];}
  const hits=buildExamples().filter(p=>re.test(p[0]));
  hits.sort((a,b)=>{
    const ea=new RegExp("\\b"+w+"\\b","i").test(a[0])?0:1;
    const eb=new RegExp("\\b"+w+"\\b","i").test(b[0])?0:1;
    if(ea!==eb)return ea-eb;
    return Math.abs(a[0].length-34)-Math.abs(b[0].length-34);
  });
  const out=[],seen={};
  for(const h of hits){const k=h[0].toLowerCase();if(seen[k])continue;seen[k]=1;out.push(h);if(out.length>=(max||2))break;}
  return out;
}

/* ================= дрилл и голос ================= */
let pat=null;
function startPat(id,mode){
  let items=shuffle(PATTERNS[id].items.slice());
  if(mode==="voice")items=items.slice(0,6);   // голос дороже по времени — берём часть
  if(mode==="listen")items=items.slice(0,6);
  pat={id:id,mode:mode,items:items,pos:0,fast:0,slow:0,hit:0,miss:0,t0:0,phase:"ask"};
  go({n:"pat"});
}
/* смешанный дрилл: фразы из разных пройденных уроков вперемешку */
function studiedPatterns(){return Object.keys(PATTERNS).filter(id=>S.pat[id]&&S.pat[id].box>0);}
function startMixed(){
  const ids=studiedPatterns(),bag=[];
  ids.forEach(id=>PATTERNS[id].items.forEach(it=>bag.push(it)));
  pat={id:ids[0],mixed:true,mode:"drill",items:shuffle(bag).slice(0,10),
       pos:0,fast:0,slow:0,hit:0,miss:0,t0:0,phase:"ask"};
  go({n:"pat"});
}
/* три варианта перевода для задания на слух */
function lisOptions(it){
  const wrong=[];
  const ids=Object.keys(PATTERNS);
  while(wrong.length<2){
    const p=PATTERNS[ids[Math.floor(Math.random()*ids.length)]];
    const c=p.items[Math.floor(Math.random()*p.items.length)][0];
    if(c!==it[0]&&wrong.indexOf(c)<0)wrong.push(c);
  }
  return shuffle([it[0]].concat(wrong));
}
function patHeadline(){
  const P=PATTERNS[pat.id];
  return '<div class="qmeta"><span>'+esc(pat.mixed?"смешанный дрилл":P.p)+'</span><span>'+(pat.pos+1)+' / '+pat.items.length+'</span></div>'+
    '<div class="qprog"><i style="width:'+Math.round(pat.pos/pat.items.length*100)+'%"></i></div>';
}
function viewPat(){
  if(pat.pos>=pat.items.length)return patDone();
  const it=pat.items[pat.pos],L=byId(pat.id);
  setHead(pat.mixed?"Смешанный дрилл":L.t,
    pat.mode==="drill"?"дрилл":(pat.mode==="listen"?"на слух":"голос"));
  const task=pat.mode==="drill"?"Прочитай, потом скажи за пять секунд"
            :(pat.mode==="listen"?"Слушай и выбери перевод":"Скажи вслух в микрофон");
  let head,body="";

  if(pat.mode==="listen"){
    if(pat.phase==="ask"){
      if(!pat.opts)pat.opts=lisOptions(it);
      head='<div class="playbox"><button class="btn" id="play">'+ICON.sound+' Прослушать ещё раз</button></div>';
      body=pat.opts.map((o,k)=>'<button class="opt" data-l="'+k+'">'+esc(o)+'</button>').join("");
    }else{
      head='<div class="verdict '+(pat.ok?"ok":"no")+'" style="margin:0 0 16px"><div class="vh">'+
        (pat.ok?ICON.check+"Верно":ICON.x+"Не то")+'</div>'+
        (pat.ok?"Услышал правильно.":"Послушай ещё раз и сравни с текстом — так ухо и настраивается.")+'</div>'+
        '<div class="target">'+esc(it[1])+' <button class="spk" style="position:static;margin-left:6px" id="spk">'+ICON.sound+'</button></div>'+
        '<div class="small" style="margin-top:6px">'+esc(it[0])+'</div>';
      body='<div style="height:16px"></div><button class="btn" id="next">Дальше</button>';
    }
  }else if(pat.mode==="drill"){
    head='<div class="prompt">'+esc(it[0])+'</div>'+
      (pat.phase==="show"&&pat.lastFast!=null
        ? '<div class="verdict '+(pat.lastFast?"ok":"typo")+'" style="margin:0 0 16px"><div class="vh">'+
          (pat.lastFast?ICON.check+"Успел":ICON.x+"Медленно")+'</div>'+
          (pat.lastFast?"Конструкция уже на автомате.":"Пока собираешь по кирпичикам. Время на чтение не считается — пять секунд идут только на саму фразу. Повтори её вслух ещё три раза.")+'</div>'
        : "");
    body=(pat.phase==="ask")
      ? '<div class="tbar"><i id="tb"></i></div><div class="small" id="tnote" style="margin:-10px 0 16px">Читаешь…</div>'+
        '<button class="btn" id="said">Сказал</button>'+
        '<div style="height:10px"></div><button class="btn ghost" id="skip">Не получилось</button>'
      : '<div class="target">'+esc(it[1])+' <button class="spk" style="position:static;margin-left:6px" id="spk">'+ICON.sound+'</button></div>'+
        '<div style="height:16px"></div><button class="btn" id="next">Сказал так же</button>'+
        '<div style="height:10px"></div><button class="btn sec" id="wrong">Сказал не так</button>'+
        (pat.lastFast===false?'<div style="height:10px"></div><button class="btn ghost" id="wasfast">Успел, просто не нажал</button>':"");
  }else{
    head='<div class="prompt">'+esc(it[0])+'</div>'+
      (pat.phase==="show"
        ? '<div class="verdict '+(pat.ok?"ok":"no")+'" style="margin:0 0 16px"><div class="vh">'+
          (pat.ok?ICON.check+"Похоже на эталон":ICON.x+"Не совпало")+'</div>'+
          (pat.ok?"Так и звучит.":"Микрофон услышал другое. Иногда виноват шум, иногда произношение — послушай эталон и повтори.")+'</div>'
        : "");
    body=(pat.phase==="ask")
      ? '<button class="btn mic" id="mic">'+ICON.sound+' Нажми и скажи</button>'+
        '<div style="height:10px"></div><button class="btn ghost" id="showit">Показать ответ</button>'+
        '<div id="rec" class="small" style="margin-top:12px"></div>'
      : '<div class="target">'+esc(it[1])+' <button class="spk" style="position:static;margin-left:6px" id="spk">'+ICON.sound+'</button></div>'+
        (pat.heard?'<div class="small" style="margin-top:8px">Услышано: '+esc(pat.heard)+'</div>':'')+
        '<div style="height:16px"></div>'+
        (pat.ok?'':'<button class="btn sec" id="mark">Всё же засчитать</button><div style="height:10px"></div>')+
        '<button class="btn" id="next">Дальше</button>';
  }

  app.innerHTML=backBtn("lessons","Выйти")+patHeadline()+
    '<div class="qtask">'+task+'</div>'+head+body;

  if(pat.mode==="listen"&&pat.phase==="ask"){
    say(it[1]);
    document.getElementById("play").onclick=()=>say(it[1]);
    lockTaps(400);
    app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
      if(tapsLocked())return;
      const chosen=pat.opts[+b.dataset.l];
      pat.ok=chosen===it[0];
      if(pat.ok)pat.hit++;else pat.miss++;
      pat.phase="show";render();
    });
  }
  if(pat.mode==="drill"&&pat.phase==="ask"){
    // время на чтение зависит от длины фразы; пять секунд идут только на речь
    const words=it[0].split(/\s+/).filter(Boolean).length;
    const readMs=Math.min(3200,Math.max(1200,600+320*words)),sayMs=5000;
    pat.t0=Date.now();
    const tb=document.getElementById("tb"),note=document.getElementById("tnote");
    tb.style.width="100%";
    pat.startTimer=setTimeout(()=>{
      if(pat.phase!=="ask")return;
      if(note)note.textContent="Говори";
      tb.style.transition="width "+(sayMs/1000)+"s linear";tb.style.width="0%";
      pat.timer=setTimeout(()=>{if(pat.phase==="ask")patReveal(false);},sayMs+600);
    },readMs);
    document.getElementById("said").onclick=()=>patReveal((Date.now()-pat.t0)<=readMs+sayMs+600);
    document.getElementById("skip").onclick=()=>patReveal(false);
  }
  if(pat.mode==="voice"&&pat.phase==="ask"){
    document.getElementById("mic").onclick=listen;
    document.getElementById("showit").onclick=()=>{stopRec();pat.heard="";pat.ok=false;pat.phase="show";pat.miss++;render();};
  }
  if(pat.phase==="show"){
    const sp=document.getElementById("spk");if(sp)sp.onclick=()=>say(it[1]);
    const wr=document.getElementById("wrong");
    if(wr)wr.onclick=()=>{
      if(pat.lastFast){pat.fast--;pat.slow++;}
      pat.items.push(it);
      pat.pos++;pat.phase="ask";pat.lastFast=null;pat.opts=null;render();
    };
    const mk=document.getElementById("mark");if(mk)mk.onclick=()=>{pat.miss--;pat.hit++;pat.ok=true;render();};
    const wf=document.getElementById("wasfast");
    if(wf)wf.onclick=()=>{
      openSheetHTML(
        '<div class="word" style="font-size:20px">Точно успел?</div>'+
        '<p class="small" style="margin-top:10px">Эта кнопка нужна только для одного случая: ты договорил вовремя, но не успел ткнуть в экран.</p>'+
        '<p class="small">Если внутри было «ну почти» — не засчитывай. Скорость в прогрессе показывает, готов ли ты говорить вживую, и обманывать тут можно только себя. Лишний повтор фразы вслух даст больше, чем красивая цифра.</p>'+
        '<div style="height:16px"></div><button class="btn sec" id="cfYes">Да, успел вовремя</button>'+
        '<div style="height:8px"></div><button class="btn" id="cfNo">Лучше повторю ещё раз</button>',
        ()=>{
          document.getElementById("cfYes").onclick=()=>{
            pat.slow--;pat.fast++;pat.lastFast=true;dismissSheet();render();
          };
          document.getElementById("cfNo").onclick=()=>{
            pat.items.push(it);           // фраза вернётся в конце подхода
            pat.pos++;pat.phase="ask";pat.lastFast=null;pat.opts=null;
            dismissSheet();render();
          };
        });
    };
    document.getElementById("next").onclick=()=>{
      stopRec();pat.pos++;pat.phase="ask";pat.heard=null;pat.lastFast=null;pat.opts=null;render();
    };
    if(pat.mode!=="listen")say(it[1]);
  }
}
function patReveal(fast){
  clearTimeout(pat.timer);clearTimeout(pat.startTimer);
  pat.lastFast=fast;if(fast)pat.fast++;else pat.slow++;
  pat.phase="show";render();
}
function looseSame(heard,target){
  const drop={a:1,an:1,the:1,to:1,of:1};
  const norm2=t=>bare(norm(t)).split(" ").filter(w=>w&&!drop[w]);
  const h=norm2(heard),t=norm2(target);
  if(!h.length)return false;
  let hit=0;t.forEach(w=>{const i=h.indexOf(w);if(i>=0){hit++;h.splice(i,1);}});
  return hit/t.length>=0.7;
}
function stopRec(){
  if(pat&&pat.rec){try{pat.rec.abort();}catch(e){}pat.rec=null;}
}
function listen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const box=document.getElementById("rec"),btn=document.getElementById("mic");
  if(pat.rec){                                   // уже слушаем — второй тап заканчивает запись
    try{pat.rec.stop();}catch(e){stopRec();}
    if(btn)btn.classList.remove("on");
    if(box)box.textContent="";
    return;
  }
  if(!SR){box.innerHTML="Браузер не умеет распознавать речь. Открой страницу в Chrome или пройди шаг через «Показать ответ» — тогда оценивай себя сам.";return;}
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;
  pat.rec=r;
  box.textContent="Слушаю… нажми ещё раз, когда закончишь";
  if(btn){btn.classList.add("on");btn.innerHTML=ICON.sound+" Слушаю…";}
  r.onresult=e=>{
    pat.rec=null;
    let best="",ok=false;
    for(let i=0;i<e.results[0].length;i++){
      const alt=e.results[0][i].transcript;
      if(!best)best=alt;
      if(looseSame(alt,pat.items[pat.pos][1])){best=alt;ok=true;break;}
    }
    pat.heard=best;pat.ok=ok;if(ok)pat.hit++;else pat.miss++;
    pat.phase="show";render();
  };
  const reset=()=>{
    pat.rec=null;
    const b=document.getElementById("mic");
    if(b){b.classList.remove("on");b.innerHTML=ICON.sound+" Нажми и скажи";}
  };
  r.onerror=ev=>{
    reset();
    if(ev.error==="aborted"){const b=document.getElementById("rec");if(b)b.textContent="";return;}
    const b=document.getElementById("rec");if(!b)return;
    b.innerHTML=ev.error==="not-allowed"
      ? "Микрофон запрещён. Разреши доступ в настройках сайта — иконка замка в адресной строке."
      : (ev.error==="no-speech"?"Ничего не услышал. Нажми и скажи ещё раз, ближе к телефону."
                               :"Распознавание недоступно: "+esc(ev.error)+". Нужен интернет и https.");
  };
  r.onend=()=>{
    const listening=!!pat.rec;
    reset();
    if(listening){const b=document.getElementById("rec");if(b)b.textContent="Не расслышал. Нажми и скажи ещё раз.";}
  };
  try{r.start();}catch(e){box.textContent="Не удалось включить микрофон.";}
}
function patDone(){
  const n=pat.items.length,mode=pat.mode,id=pat.id,mixed=pat.mixed;
  const good=mode==="drill"?pat.fast:pat.hit;
  const okAll=good/n>=0.7;
  if(!mixed){
    if(mode==="drill"){
      gradePat("pat",id,okAll);
      S.speed=S.speed||{};S.speed[id]=Math.round(good/n*100);saveState();
    }else if(mode==="listen")gradePat("lis",id,okAll);
    else gradePat("voc",id,okAll);
  }
  setHead(mixed?"Смешанный дрилл":byId(id).t,"готово");
  const msg=mode==="drill"
    ? (okAll?"Конструкция идёт на автомате. Дрилл вернётся через пару дней."
           :"Пока медленно — это нормально на первом заходе. Дрилл придёт снова завтра.")
    : mode==="listen"
    ? (okAll?"Ухо ловит фразы целиком. Так и надо."
           :"Половину не разобрал — это самое частое место провала в живом разговоре. Прослушай эталоны ещё раз.")
    : (okAll?"Микрофон тебя понимает. Значит и человек поймёт."
           :"Часть фраз не распозналась. Послушай эталоны и прогони дрилл ещё раз.");
  let nextBtn="";
  if(!mixed&&mode==="drill"&&okAll)nextBtn='<button class="btn" id="toNext">'+ICON.sound+' Дальше: на слух</button><div style="height:10px"></div>';
  if(!mixed&&mode==="listen"&&okAll)nextBtn='<button class="btn" id="toNext">'+ICON.sound+' Дальше: сказать вслух</button><div style="height:10px"></div>';
  app.innerHTML='<div class="done"><div class="big">'+good+' из '+n+'</div>'+
    '<p class="small" style="margin-top:8px">'+msg+'</p></div>'+nextBtn+
    '<button class="btn sec" id="again">Ещё раз</button><div style="height:10px"></div>'+
    '<button class="btn ghost" data-nav="lessons">К урокам</button>';
  const tn=document.getElementById("toNext");
  if(tn)tn.onclick=()=>startPat(id,mode==="drill"?"listen":"voice");
  document.getElementById("again").onclick=()=>mixed?startMixed():startPat(id,mode);
}

  const d=dueCards(),dp=patDue(),dv=vocDue(),dl=lisDue(),dw=wordsDue(),mix=studiedPatterns();

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= практика ================= */
function startDrill(q,mode,title){
  q.forEach(x=>{x.solved=false;x.ord=null;});
  drill={q,pos:0,mode,title,total:q.length,solved:0,bad:0,again:[]};
  go({n:"drill"});
}
function viewDrill(){
  if(drill.pos>=drill.q.length&&drill.again.length){drill.q=drill.q.concat(drill.again);drill.again=[];}
  if(drill.pos>=drill.q.length)return drillDone();
  const item=drill.q[drill.pos],c=item.c;
  const left=drill.q.length-drill.pos;
  setHead(drill.title,drill.solved+" из "+drill.total+(drill.q.length>drill.total?" · повтор":""));
  const pct=Math.round(drill.solved/drill.total*100);
  let main,ru="";
  if(c.q){main='<div class="qtext">'+esc(c.q).replace(/___/g,'<span class="gap"></span>')+'</div>';if(c.ru)ru='<div class="qru">'+esc(c.ru)+'</div>';}
  else{main='<div class="qru" style="font-size:21px;color:var(--fg);font-weight:500;margin-bottom:20px">'+esc(c.ru)+'</div>';}
  let body;
  if(c.t==="mc"){
    if(!item.ord)item.ord=shuffle(c.o.map((_,i)=>i));
    body=item.ord.map(oi=>'<button class="opt" data-o="'+oi+'">'+esc(c.o[oi])+'</button>').join("");
  }
  else body='<input class="ans" id="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="по-английски">'+
    '<div style="height:12px"></div><button class="btn" id="ck">Проверить</button>';
  app.innerHTML=backBtn(drill.mode==="review"?"review":"lessons","Выйти")+
    '<div class="qprog"><i style="width:'+pct+'%"></i></div>'+
    '<div class="qtask">'+esc(c.t==="mc"?(c.task||"Выбери вариант"):(c.task||"Переведи"))+'</div>'+
    main+ru+'<div id="body">'+body+'</div><div id="v"></div>';
  if(c.t==="mc"){
    lockTaps(400);
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{
      if(tapsLocked())return;
      const i=+b.dataset.o,ok=i===c.a;
      app.querySelectorAll(".opt").forEach(x=>{
        x.disabled=true;const j=+x.dataset.o;
        if(j===c.a)x.className="opt ok";else if(j===i)x.className="opt no";
      });
      answered(item,ok?"ok":"no",c.o[c.a]);
    });
  }else{
    const inp=document.getElementById("inp");
    const run=()=>{
      const ok=check(inp.value,c.a);
      const status=ok?"ok":(nearMiss(inp.value,c.a)?"typo":"no");
      inp.disabled=true;document.getElementById("ck").style.display="none";
      answered(item,status,c.a[0]);
    };
    document.getElementById("ck").onclick=run;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
  }
}
function answered(item,status,right){
  const ok=status!=="no";
  grade(item.l,item.i,ok);
  if(ok){if(!item.solved){item.solved=true;drill.solved++;}}
  else{drill.bad++;drill.again.push(item);}
  const head=status==="ok"?ICON.check+"Верно":(status==="typo"?ICON.check+"Верно, только опечатка":ICON.x+"Не то");
  document.getElementById("v").innerHTML=
    '<div class="verdict '+(status==="no"?"no":(status==="typo"?"typo":"ok"))+'"><div class="vh">'+head+'</div>'+
    (status==="ok"?"":'<div class="right">'+esc(right)+'</div>')+esc(item.c.ex).replace(/\n/g,"<br>")+'</div>'+
    '<div style="height:14px"></div><button class="btn" id="nx">Дальше</button>';
  document.getElementById("nx").onclick=()=>{drill.pos++;render();};
  decorate();
}
function drillDone(){
  const q=drill.q.slice(0,drill.total),t=drill.title,m=drill.mode,bad=drill.bad;
  setHead(drill.title,"готово");
  app.innerHTML='<div class="done"><div class="big">'+drill.total+' из '+drill.total+'</div>'+
    '<p class="small" style="margin-top:8px">'+(bad===0?"Пройдено без ошибок. Карточки вернутся через несколько дней.":
      "Пройдено, ошибок по дороге: "+bad+". Эти карточки придут завтра — так они и запоминаются.")+'</p></div>'+
    (patDue()[0]?'<button class="btn" id="toPat">'+ICON.repeat+' Дальше: дрилл на скорость</button><div style="height:10px"></div>':
                 '<button class="btn" data-nav="lessons">'+ICON.book+' К урокам</button><div style="height:10px"></div>')+
    '<button class="btn sec" id="again">Пройти ещё раз</button>';
  const tp=document.getElementById("toPat");if(tp)tp.onclick=()=>startPat(patDue()[0],"drill");
  document.getElementById("again").onclick=()=>startDrill(shuffle(q),m,t);
}

/* ================= диалоги ================= */
let dia=null;
function startDia(id){
  const D=DIALOGS.find(x=>x.id===id);
  dia={id:id,d:D,pos:0,ok:0,phase:"ask",heard:null,rec:null};
  go({n:"dia"});
}
function diaListen(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const box=document.getElementById("drec"),btn=document.getElementById("dmic");
  if(dia.rec){try{dia.rec.stop();}catch(e){dia.rec=null;}if(btn)btn.classList.remove("on");return;}
  if(!SR){box.textContent="Микрофон недоступен — напиши ответ текстом.";return;}
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;
  dia.rec=r;box.textContent="Слушаю…";
  if(btn){btn.classList.add("on");btn.innerHTML=ICON.sound+" Слушаю…";}
  const reset=()=>{dia.rec=null;const b=document.getElementById("dmic");
    if(b){b.classList.remove("on");b.innerHTML=ICON.sound+" Ответить голосом";}};
  r.onresult=e=>{
    reset();
    const line=dia.d.lines[dia.pos];
    let best=e.results[0][0].transcript,ok=false;
    for(let i=0;i<e.results[0].length;i++){
      const alt=e.results[0][i].transcript;
      if(check(alt,line.a)||looseSame(alt,line.ans)){best=alt;ok=true;break;}
    }
    dia.heard=best;dia.ok=ok;if(ok)dia.okCount=(dia.okCount||0)+1;
    dia.phase="show";render();
  };
  r.onerror=ev=>{reset();const b=document.getElementById("drec");
    if(b)b.textContent=ev.error==="aborted"?"":(ev.error==="not-allowed"?"Микрофон запрещён — разреши доступ в настройках сайта.":"Не расслышал. Попробуй ещё раз или напиши текстом.");};
  r.onend=()=>reset();
  try{r.start();}catch(e){box.textContent="Не удалось включить микрофон.";}
}
function viewDia(){
  const D=dia.d;
  if(dia.pos>=D.lines.length){
    const n=D.lines.length,good=dia.okCount||0;
    S.dia[D.id]={done:1,score:Math.round(good/n*100),due:dayNum(today())+7};saveState();
    setHead(D.t,"готово");
    app.innerHTML='<div class="done"><div class="big">'+good+' из '+n+'</div>'+
      '<p class="small" style="margin-top:8px">'+(good/n>=0.7
        ? "Диалог держишь. Такой же разговор в жизни ты уже вытянешь."
        : "Часть реплик далась тяжело — прогони диалог ещё раз, ответы уже знакомы.")+'</p></div>'+
      '<button class="btn sec" id="dagain">Ещё раз</button><div style="height:10px"></div>'+
      '<button class="btn ghost" data-nav="lessons">К урокам</button>';
    document.getElementById("dagain").onclick=()=>startDia(D.id);
    return;
  }
  const line=D.lines[dia.pos];
  setHead(D.t,(dia.pos+1)+" / "+D.lines.length);
  app.innerHTML=backBtn("lessons","Выйти")+
    '<div class="qmeta"><span>диалог</span><span>'+(dia.pos+1)+' / '+D.lines.length+'</span></div>'+
    '<div class="qprog"><i style="width:'+Math.round(dia.pos/D.lines.length*100)+'%"></i></div>'+
    '<div class="bubble"><div class="be">'+esc(line.q)+
      ' <button class="spk" style="position:static;margin-left:6px" id="dsay">'+ICON.sound+'</button></div>'+
      '<div class="br">'+esc(line.ru)+'</div></div>'+
    '<div class="qtask" style="margin-top:16px">Ответь: '+esc(line.task)+'</div>'+
    (dia.phase==="ask"
      ? '<input class="ans" id="dinp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="напиши ответ">'+
        '<div style="height:10px"></div><button class="btn" id="dcheck">Проверить</button>'+
        '<div style="height:10px"></div><button class="btn sec mic" id="dmic">'+ICON.sound+' Ответить голосом</button>'+
        '<div id="drec" class="small" style="margin-top:12px"></div>'
      : '<div class="verdict '+(dia.ok?"ok":"no")+'"><div class="vh">'+
        (dia.ok?ICON.check+"Так и есть":ICON.x+"Можно было сказать так")+'</div>'+
        (dia.heard?'Услышано: '+esc(dia.heard):"")+'</div>'+
        '<div style="height:14px"></div><div class="target">'+esc(line.ans)+
        ' <button class="spk" style="position:static;margin-left:6px" id="dans">'+ICON.sound+'</button></div>'+
        '<div style="height:18px"></div><button class="btn" id="dnext">Дальше</button>');
  document.getElementById("dsay").onclick=()=>say(line.q);
  if(dia.phase==="ask"){
    say(line.q);
    const inp=document.getElementById("dinp");
    const run=()=>{
      const ok=check(inp.value,line.a)||looseSame(inp.value,line.ans);
      dia.heard=null;dia.ok=ok;if(ok)dia.okCount=(dia.okCount||0)+1;
      dia.phase="show";render();
    };
    document.getElementById("dcheck").onclick=run;
    inp.addEventListener("keydown",e=>{if(e.key==="Enter")run();});
    document.getElementById("dmic").onclick=diaListen;
  }else{
    document.getElementById("dans").onclick=()=>say(line.ans);
    say(line.ans);
    document.getElementById("dnext").onclick=()=>{
      if(dia.rec){try{dia.rec.abort();}catch(e){}dia.rec=null;}
      dia.pos++;dia.phase="ask";dia.heard=null;render();
    };
  }
}

    (wr.shown
      ? '<div class="target">'+esc(w)+' <button class="spk" style="position:static;margin-left:6px" id="spk">'+ICON.sound+'</button></div>'+
        '<div style="height:18px"></div><button class="btn" id="knew">Вспомнил</button>'+
        '<div style="height:10px"></div><button class="btn sec" id="nope">Не вспомнил</button>'
      : '<button class="btn" id="show">Показать слово</button>');
  if(wr.shown){
    document.getElementById("spk").onclick=()=>say(w);

      const st=S.words[w];st.box=ok?Math.min(4,(st.box||0)+1):0;

/* ================= сохранение и перенос прогресса ================= */
function exportProgress(){
  const data=JSON.stringify({app:"english-trainer",version:1,saved:today(),state:S},null,2);
  const name="english-trainer-"+today()+".json";
  try{
    const blob=new Blob([data],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
    return true;
  }catch(e){
    // если скачивание недоступно — показываем текст, чтобы скопировать вручную
    openSheetHTML(
      '<div class="word" style="font-size:20px">Прогресс в виде текста</div>'+
      '<p class="small" style="margin-top:8px">Скачивание недоступно. Скопируй этот текст и сохрани в заметки — из него можно восстановиться.</p>'+
      '<div class="promptbox">'+esc(data)+'</div>'+
      '<button class="btn" id="expCopy">Скопировать</button>'+
      '<div style="height:8px"></div><button class="btn ghost" id="expCls">Закрыть</button>',
      ()=>{
        document.getElementById("expCopy").onclick=e=>copyPrompt(data,e.currentTarget);
        document.getElementById("expCls").onclick=dismissSheet;
      });
    return false;
  }
}
function applyImported(obj){
  const st=(obj&&obj.state&&typeof obj.state==="object")?obj.state:obj;
  if(!st||typeof st!=="object"||(!st.srs&&!st.pat&&!st.words))return false;
  S=st;sanitizeState();
  if(!S.day)S.day=today();
  saveState();
  return true;
}
function importProgress(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj=null;
    try{obj=JSON.parse(String(r.result));}catch(e){}
    if(!obj)return alert("Не удалось прочитать файл: это не похоже на сохранение прогресса.");
    if(!confirm("Заменить текущий прогресс данными из файла? Отменить это будет нельзя."))return;
    if(applyImported(obj)){go({n:"progress"});}
    else alert("В файле нет данных прогресса.");
  };
  r.onerror=()=>alert("Не удалось прочитать файл.");
  r.readAsText(file);
}

    '<div class="label">По урокам</div>'+
    '<p class="small">Скорость — доля фраз из дрилла, выданных быстрее пяти секунд. Знание проверяется карточками, а готовность говорить — только дриллом.</p>'+
    '<p class="small">Разобрано — сколько карточек урока ты вообще проходил. Закреплено — сколько уже сидит в памяти: три верных ответа подряд с растущими промежутками. Сразу после первого прохода закреплено всегда ноль, это нормально — карточка вернётся завтра, потом через три дня, потом через неделю.</p>';
  LESSONS.forEach(l=>{
    const st=lessonStat(l),pct=Math.round(st.learned/st.total*100),spct=Math.round(st.started/st.total*100);
    const state=st.learned===st.total?"выучен":(st.started===0?"не начат":(st.started<st.total?"в процессе":"на закреплении"));
    h+='<div class="row" data-les="'+l.id+'" style="padding:12px 14px"><div class="body">'+
      '<div class="t" style="font-size:14.5px">'+esc(l.t)+'</div>'+
      '<div class="small" style="font-size:12px;margin-top:3px">разобрано '+st.started+'/'+st.total+' · закреплено '+st.learned+'/'+st.total+
        ((S.speed&&S.speed[l.id]!==undefined)?' · скорость '+S.speed[l.id]+'%':'')+'</div>'+
      '<div class="bar"><i style="width:'+spct+'%;background:var(--border-strong)"></i>'+
      '<b style="display:block;height:100%;width:'+pct+'%;background:var(--ok);border-radius:99px;margin-top:-4px"></b></div></div>'+
      '<div class="small" style="font-size:11.5px;text-align:right;max-width:78px">'+state+'</div></div>';
  });
  const weak=[];
  Object.keys(S.err).forEach(k=>{
    const e=S.err[k];if(e.t<2||e.w/e.t<0.34)return;
    const p=k.split("#"),l=byId(p[0]);if(!l)return;
    const c=l.cards[+p[1]];if(!c)return;
    weak.push({k:k,l:l,i:+p[1],c:c,w:e.w,t:e.t});
  });
  weak.sort((a,b)=>(b.w/b.t)-(a.w/a.t)||b.w-a.w);
  const top=weak.slice(0,8);
  h+='<div class="label">Слабые места</div>';
  if(!top.length){
    h+='<p class="small">Пока пусто: сюда попадают задания, на которых ты ошибаешься чаще, чем в трети случаев. Нужно хотя бы два подхода к заданию, чтобы оно сюда попало.</p>';
  }else{
    h+='<p class="small" style="margin-bottom:12px">Задания, где ты ошибаешься чаще всего. Это и есть твои настоящие дыры — их полезнее прогнать, чем повторять то, что и так знаешь.</p>';
    top.forEach(x=>{
      h+='<div class="row" data-les="'+x.l.id+'" style="padding:12px 14px"><div class="body">'+
        '<div class="t" style="font-size:14.5px">'+esc(x.c.q||x.c.ru||"")+'</div>'+
        '<div class="small" style="font-size:12px;margin-top:3px">'+esc(x.l.t)+' · ошибок '+x.w+' из '+x.t+'</div>'+
        '</div></div>';
    });
    h+='<div style="height:6px"></div><button class="btn" id="goWeak">'+ICON.repeat+' Прогнать слабые места · '+top.length+'</button>';
  }
  h+='<div class="label">Режим дня</div>'+
    '<div class="card" style="padding:14px 16px">'+
    '<table style="margin:0"><tr><td style="white-space:nowrap;font-weight:600">Утро</td>'+
    '<td>Повтор, 5\u20138 мин. На свежую голову — то, что вот-вот забудется.</td></tr>'+
    '<tr><td style="white-space:nowrap;font-weight:600">Днём</td>'+
    '<td>Дрилл на скорость или голос, 3\u20135 мин. Можно на ходу — телефон читает и слушает.</td></tr>'+
    '<tr><td style="white-space:nowrap;font-weight:600">Вечер</td>'+
    '<td>Новый урок, 12\u201315 мин: теория, блок разбора, потом дрилл и голос по той же конструкции.</td></tr></table>'+
    '<p class="small" style="margin:10px 0 0">Итого 20\u201325 минут в день урока и 8\u201310 в дни без нового материала.</p></div>'+
    '<div class="label">Четыре шага урока</div>'+
    '<div class="card" style="padding:14px 16px"><table style="margin:0">'+
    '<tr><td style="white-space:nowrap;font-weight:600">1. Теория</td><td>Понять, как устроена конструкция.</td></tr>'+
    '<tr><td style="white-space:nowrap;font-weight:600">2. Разбор</td><td>Медленные задания с объяснением каждой ошибки.</td></tr>'+
    '<tr><td style="white-space:nowrap;font-weight:600">3. Дрилл</td><td>Восемь подстановок по пять секунд. Здесь не думают — доводят до автомата.</td></tr>'+
    '<tr><td style="white-space:nowrap;font-weight:600">4. Голос</td><td>Те же фразы в микрофон. Видно, где тормозишь и где произношение мешает понять.</td></tr>'+
    '</table><p class="small" style="margin:10px 0 0">Шаги 1 и 2 дают знание, шаги 3 и 4 — речь. Пропускать вторую половину бессмысленно: именно она отвечает за то, чтобы заговорить.</p></div>'+
    '<div class="label">Пять правил</div>'+
    '<div class="card" style="padding:14px 16px"><ul class="small" style="margin:0;padding-left:18px;line-height:1.6">'+
    '<li>Не делай всё за один присест: три подхода по семь минут дают больше, чем двадцать пять подряд.</li>'+
    '<li>Не бери два урока в день, даже если идёт легко — через неделю повторы превратятся в лавину.</li>'+
    '<li>Пропустил день — начинай с повтора. Догонять надо расписание повторов, а не количество тем.</li>'+
    '<li>Дни без урока не пропускай: в них разгребается очередь и закрепляется прошлый блок.</li>'+
    '<li>Минимальная версия дня — повтор плюс задание вслух, десять минут. Курс растянется, но не развалится.</li>'+
    '</ul><p class="small" style="margin:10px 0 0">Тренажёр ставит грамматику в голову, но рот тренируется только ртом.</p></div>'+
    '<div class="label">Перенос прогресса</div>'+
    '<p class="small" style="margin-bottom:12px">Прогресс живёт в памяти браузера и привязан к адресу сайта. Сохрани его в файл перед сменой телефона, переустановкой или чисткой браузера.</p>'+
    '<button class="btn sec" id="expBtn">'+ICON.layers+' Сохранить в файл</button>'+
    '<div style="height:10px"></div>'+
    '<button class="btn sec" id="impBtn">'+ICON.repeat+' Загрузить из файла</button>'+
    '<input type="file" id="impFile" accept="application/json,.json" style="display:none">'+
    '<div style="height:18px"></div><button class="btn ghost" id="rst">Сбросить прогресс</button>'+
    '<p class="small" style="text-align:center;margin:16px 0 8px;font-size:11.5px">сборка '+BUILD+'</p>'+
    '<div style="height:16px"></div>';
  app.innerHTML=h;
  app.querySelectorAll("[data-les]").forEach(el=>el.onclick=()=>go({n:"lesson",id:el.dataset.les}));
  const gw2=document.getElementById("goWeak");
  if(gw2)gw2.onclick=()=>startDrill(shuffle(top.map(x=>({l:x.l.id,i:x.i,c:x.c}))),"weak","Слабые места");
  document.getElementById("expBtn").onclick=()=>exportProgress();
  const impF=document.getElementById("impFile");
  document.getElementById("impBtn").onclick=()=>impF.click();
  impF.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)importProgress(f);e.target.value="";};
  document.getElementById("rst").onclick=()=>{if(confirm("Стереть весь прогресс?")){S.srs={};S.pat={};S.voc={};S.lis={};S.err={};S.dia={};S.ai={};S.speed={};S.total=0;S.right=0;S.streak=0;S.day=today();saveState();render();}};
}

/* ================= старт ================= */
(async function(){
  try{history.replaceState({d:1},"");}catch(e){}
  try{
    S=await loadState();applyTheme();
  }catch(e){
    console.error(e);
    S={srs:{},pat:{},voc:{},lis:{},err:{},words:{},dia:{},ai:{},speed:{},day:null,streak:0,total:0,right:0,theme:null};
  }
  render();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
      reg.update();
      if(reg.waiting)reg.waiting.postMessage({type:"SKIP_WAITING"});
      reg.addEventListener("updatefound",function(){
        var w=reg.installing;
        if(!w)return;
        w.addEventListener("statechange",function(){
          if(w.state==="installed"&&navigator.serviceWorker.controller){
            w.postMessage({type:"SKIP_WAITING"});
          }
        });
      });
    }).catch(function(e){console.log("SW не зарегистрирован:",e);});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",function(){
      if(reloaded)return; reloaded=true; location.reload();
    });
  });
}
</script>
</body>
</html>
